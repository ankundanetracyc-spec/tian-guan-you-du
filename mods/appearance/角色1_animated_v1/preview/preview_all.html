<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<title>角色1 四序列帧预览（64帧 @64fps）</title>
<style>
 body{background:#26262e;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:16px;}
 h1{text-align:center;font-size:18px}
 .seq{display:inline-block;vertical-align:top;margin:10px}
 .stage{position:relative;width:360px;height:480px;background:#45454f;border:2px solid #666}
 canvas{width:360px;height:480px;image-rendering:pixelated}
 .grid{position:absolute;inset:0;pointer-events:none;opacity:.18;
   background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 30px),
              repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 30px)}
 .anchor{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border:2px solid #f66;
   border-radius:50%;left:180px;top:470px;pointer-events:none}
 .ground{position:absolute;left:0;right:0;top:470px;height:0;border-top:2px dashed #6cf;pointer-events:none}
 .controls{text-align:center;margin:6px 0;font-size:12px}
 button{padding:3px 10px;margin:0 3px;cursor:pointer}
 input[type=range]{width:130px;vertical-align:middle}
 .desc{font-size:11px;color:#99a;text-align:center;width:360px}
 .tag{color:#8cf;font-size:11px}
</style></head><body>
<h1>角色1 · 四种序列帧（各64帧 @64fps，透明底，锚点 360,940）</h1>

<div class="seq">
  <h3>死亡跪地 <span class="tag">death_kneel</span></h3>
  <div class="stage" data-seq="death_kneel">
    <canvas width="720" height="960"></canvas>
    <div class="grid"></div><div class="anchor"></div><div class="ground"></div>
  </div>
  <div class="controls">
    <button class="play">暂停</button><button class="prev">◀</button><button class="next">▶</button>
    <span class="fi">1</span>/64
    <input type="range" class="slider" min="1" max="64" value="1">
    <label><input type="checkbox" class="gridchk" checked> 网格/锚点</label>
  </div>
  <div class="desc">001-012 踉跄 → 013-024 跪落 → 025-040 瘫软 → 041-048 垂落 → 049-064 定格</div>
</div>
<div class="seq">
  <h3>待机 <span class="tag">idle</span></h3>
  <div class="stage" data-seq="idle">
    <canvas width="720" height="960"></canvas>
    <div class="grid"></div><div class="anchor"></div><div class="ground"></div>
  </div>
  <div class="controls">
    <button class="play">暂停</button><button class="prev">◀</button><button class="next">▶</button>
    <span class="fi">1</span>/64
    <input type="range" class="slider" min="1" max="64" value="1">
    <label><input type="checkbox" class="gridchk" checked> 网格/锚点</label>
  </div>
  <div class="desc">基于原26帧清洗+交叉淡化插帧，循环64帧，呼吸起伏</div>
</div>
<div class="seq">
  <h3>攻击 <span class="tag">attack</span></h3>
  <div class="stage" data-seq="attack">
    <canvas width="720" height="960"></canvas>
    <div class="grid"></div><div class="anchor"></div><div class="ground"></div>
  </div>
  <div class="controls">
    <button class="play">暂停</button><button class="prev">◀</button><button class="next">▶</button>
    <span class="fi">1</span>/64
    <input type="range" class="slider" min="1" max="64" value="1">
    <label><input type="checkbox" class="gridchk" checked> 网格/锚点</label>
  </div>
  <div class="desc">基于原34帧清洗+交叉淡化插帧，起手-施法-收势，64帧</div>
</div>
<div class="seq">
  <h3>受击 <span class="tag">hurt</span></h3>
  <div class="stage" data-seq="hurt">
    <canvas width="720" height="960"></canvas>
    <div class="grid"></div><div class="anchor"></div><div class="ground"></div>
  </div>
  <div class="controls">
    <button class="play">暂停</button><button class="prev">◀</button><button class="next">▶</button>
    <span class="fi">1</span>/64
    <input type="range" class="slider" min="1" max="64" value="1">
    <label><input type="checkbox" class="gridchk" checked> 网格/锚点</label>
  </div>
  <div class="desc">001-010 受击后仰 → 011-020 踉跄 → 021-032 回稳 → 033-048 复位 → 049-064 定格</div>
</div>
<script>
const seqs = document.querySelectorAll('.seq');
const imgs = {};
seqs.forEach(s=>{
  const name = s.dataset.seq;
  imgs[name] = Array.from({length:64},(_,i)=>`../${name}/${String(i+1).padStart(3,'0')}.png`);
  const cv = s.querySelector('canvas'), ctx = cv.getContext('2d');
  const img = new Image(); let idx = 0;
  const st = s.querySelector('.stage');
  s.querySelector('.play').onclick = ()=>{
    const btn = s.querySelector('.play');
    const playing = btn.dataset.p=='1';
    btn.dataset.p = playing?'0':'1'; btn.textContent = playing?'播放':'暂停';
    if(!playing) step();
  };
  s.querySelector('.prev').onclick = ()=>draw((idx+63)%64);
  s.querySelector('.next').onclick = ()=>draw((idx+1)%64);
  s.querySelector('.slider').oninput = (e)=>{ s.querySelector('.play').dataset.p='0';
    s.querySelector('.play').textContent='播放'; draw(+e.target.value-1); };
  s.querySelector('.gridchk').onchange = (e)=>{
    st.querySelector('.grid').style.opacity = e.target.checked?'0.18':'0';
    st.querySelector('.anchor').style.opacity = e.target.checked?'1':'0';
    st.querySelector('.ground').style.opacity = e.target.checked?'1':'0';
  };
  function draw(i){ idx=i; s.querySelector('.fi').textContent=i+1;
    s.querySelector('.slider').value=i+1;
    img.onload=()=>{ctx.clearRect(0,0,720,960);ctx.drawImage(img,0,0,720,960);};
    img.src=imgs[name][i]; }
  let last=0;
  function step(t){ requestAnimationFrame(step);
    if(s.querySelector('.play').dataset.p!='1') return;
    if(last && t-last>=1000/64){last=t; draw((idx+1)%64);}
    else if(!last) last=t; }
  draw(0); requestAnimationFrame(step);
});
</script></body></html>
