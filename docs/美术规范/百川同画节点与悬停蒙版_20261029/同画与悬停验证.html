<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>百川 · 同画与建筑悬停验证</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee5d4;color:#514535;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1840px;margin:auto;padding:24px}h1{font-size:27px;margin:0 0 6px}p{margin:8px 0 16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,a{font:inherit;color:inherit}button{padding:5px 13px;background:#faf1de;border:1px solid #b8a583;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#786345;color:#fff6df}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.card{border:1px solid #bfae8e;background:#f8f0df;border-radius:6px;overflow:hidden}h2{font-size:18px;padding:10px 16px;margin:0}.view{height:650px;overflow:auto;background:#dfc38b}.scene{width:1254px;height:1254px;position:relative}.scene>img{display:block;width:100%;height:100%}.scene>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.fit .scene{width:100%;height:auto;aspect-ratio:1}.fit .view{height:auto;max-height:80vh}.caption{padding:10px 16px}.name{border:0;background:transparent;padding:0;font-size:17px}.name:hover{color:#9c5e2b}.status{font-size:14px;color:#806b4e;min-height:24px}.note{font-size:14px;color:#7d705e}.selection{border-left:3px solid #9a8055;padding:10px 16px;background:#faf3e2;margin-top:20px;min-height:48px}@media(max-width:900px){.grid{grid-template-columns:1fr}main{padding:15px}.view{height:540px}}
</style><main><h1>入口与地形同画 · 悬停验证</h1><p>玉虚山门在山肩上，绛阙城门在连通平地。建筑与山水同一张图生成，鼠标移到入口上时只提亮建筑。</p><div class="toolbar"><button id="native" aria-pressed="true">原像素检查</button><button id="fit" aria-pressed="false">查看完整局部</button><span class="note">可在画面内滚动查看周围地形；点击入口或地点名称。</span></div><div id="grid" class="grid"></div><div class="selection" role="status" id="selection">点击地点可查看落位说明。</div><p class="note">这是两处同画与蒙版的验证，尚未批量替换地图。正常状态直接显示完整原图；提亮层提取自同一张图，不重新画、不缩放建筑。两处实际建筑宽度仍需在全套制作时统一分级。</p><p><a href="README.md">制作与像素检查记录</a></p></main><script src="sites.js"></script><script>
const state={sites:[],fit:false};window.jointPreview=state;
function imageLoad(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(Error(src));img.src=src})}
function focusView(entry){if(state.fit)return;entry.view.scrollLeft=Math.max(0,entry.site.maskRect[0]+entry.site.maskRect[2]/2-entry.view.clientWidth/2);entry.view.scrollTop=Math.max(0,entry.site.maskRect[1]-220)}
function choose(entry){document.querySelector('#selection').textContent=entry.site.name+'：'+(entry.site.type==='sect'?'入口落在连续山肩上，山体在建筑下方延伸；入口与树林分开。':'入口周围是连通平地，原先脚下的山脊已撤去；城门与树林分开。')}
async function make(site){
 const card=document.createElement('section');card.className='card';card.dataset.id=site.id;
 const title=document.createElement('h2');title.textContent=site.name+' · '+(site.type==='sect'?'山地落位':'平原落位');
 const view=document.createElement('div');view.className='view';const scene=document.createElement('div');scene.className='scene';
 const [base,mask]=await Promise.all([imageLoad(site.scene),imageLoad(site.mask)]);base.alt=site.name+'入口与地形同画原图';
 const overlay=document.createElement('canvas');overlay.width=1254;overlay.height=1254;const ctx=overlay.getContext('2d');scene.append(base,overlay);view.append(scene);
 const cap=document.createElement('div');cap.className='caption';const name=document.createElement('button');name.className='name';name.textContent=site.name;name.setAttribute('aria-label','选择'+site.name);const status=document.createElement('div');status.className='status';status.textContent='将鼠标移至建筑上，树木与山体不参与提亮。';cap.append(name,status);card.append(title,view,cap);document.querySelector('#grid').append(card);
 const off=document.createElement('canvas');off.width=mask.width;off.height=mask.height;const oc=off.getContext('2d',{willReadFrequently:true});oc.drawImage(mask,0,0);const pixels=oc.getImageData(0,0,mask.width,mask.height).data;
 const entry={site,card,scene,view,hover:false,pixels,loaded:true};state.sites.push(entry);
 entry.hit=(x,y)=>{const [left,top,w,h]=site.maskRect;const ix=Math.floor(x-left),iy=Math.floor(y-top);return ix>=0&&iy>=0&&ix<w&&iy<h&&pixels[(iy*w+ix)*4+3]>64};
 entry.highlight=on=>{if(entry.hover===on)return;entry.hover=on;ctx.clearRect(0,0,1254,1254);if(on){ctx.filter='brightness(1.24) saturate(.88)';ctx.drawImage(mask,site.maskRect[0],site.maskRect[1]);ctx.filter='none'}scene.style.cursor=on?'pointer':'auto';status.textContent=on?'仅建筑提亮 · 点击查看地点':'将鼠标移至建筑上，树木与山体不参与提亮。'};
 const point=e=>{const box=scene.getBoundingClientRect();return [(e.clientX-box.left)*1254/box.width,(e.clientY-box.top)*1254/box.height]};
 scene.addEventListener('mousemove',e=>{const p=point(e);entry.highlight(entry.hit(...p))});scene.addEventListener('mouseleave',()=>entry.highlight(false));scene.addEventListener('click',e=>{if(entry.hit(...point(e)))choose(entry)});
 name.onmouseenter=name.onfocus=()=>entry.highlight(true);name.onmouseleave=name.onblur=()=>entry.highlight(false);name.onclick=()=>choose(entry);focusView(entry);return entry;
}
function mode(fit){state.fit=fit;document.querySelector('#grid').classList.toggle('fit',fit);document.querySelector('#fit').setAttribute('aria-pressed',String(fit));document.querySelector('#native').setAttribute('aria-pressed',String(!fit));for(const s of state.sites){s.highlight(false);focusView(s)}}
document.querySelector('#fit').onclick=()=>mode(true);document.querySelector('#native').onclick=()=>mode(false);
Promise.all(window.JOINT_SITES.map(make)).then(()=>{state.ready=true}).catch(e=>{document.querySelector('#selection').textContent='图像未能读取：'+e.message});
</script></html>
