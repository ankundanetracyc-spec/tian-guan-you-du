<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>百川 · 同画舆图</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#d8c299;color:#514737;font-family:serif}#view{position:absolute;inset:0;overflow:hidden;touch-action:none}#world{position:absolute;width:6144px;height:6144px;transform-origin:0 0}#terrain,#roads,#labels,#highlight{position:absolute;inset:0}#terrain{width:6144px;height:6144px}#roads{pointer-events:none}#labels{pointer-events:none}#highlight{inset:auto;pointer-events:none;filter:brightness(1.22) saturate(.9);display:none}#labels button{position:absolute;background:none;border:0;font-family:serif;color:#594d3d;text-shadow:0 1px 2px #e4d3ab;cursor:pointer;pointer-events:auto;padding:0}#labels button:hover,#labels button.active{color:#9a602b}#labels .natural{position:absolute;width:8px;height:8px;border-radius:50%;border:1px solid #6d604b;background:#d5c29c}header,aside,footer{position:fixed;background:#f0e5ccee;border:1px solid #b4a180;padding:12px 16px;z-index:2}header{left:18px;top:18px;max-width:680px}h1{font-size:23px;margin:0 0 9px}button,select{font:16px serif;color:#574b38;background:#eadcbd;border:1px solid #bba77f;padding:4px 9px;cursor:pointer}header small{display:block;margin-top:8px}aside{right:18px;bottom:18px;min-width:240px}aside h2{font-size:21px;margin:0 0 8px}footer{bottom:18px;left:18px;padding:8px}#mini{display:block;width:180px;height:180px;cursor:pointer}#frame{position:absolute;border:1px solid #694f32;pointer-events:none}#status{font-size:13px;margin-top:5px}.row{display:flex;gap:7px;align-items:center;margin-top:7px}a{color:#715239}
</style>
<div id="view"><div id="world"><img id="terrain" src="../../../textures/world/bai_chuan/joint_paint_v4/master_6144.png"><canvas id="roads" width="6144" height="6144"></canvas><div id="labels"></div><img id="highlight"></div></div>
<header><h1>百川舆图 · 同画全图</h1><div class="row"><button data-name="玉虚仙宗">玉虚仙宗</button><button data-name="玄都天府">玄都天府</button><button data-name="无相圣宗">无相圣宗</button><button data-name="春水府">春水府</button><select id="jump"><option value="">地点索引（123处）</option></select></div><div class="row"><label><input id="showRoads" type="checkbox" checked>虚线路径</label><label><input id="showLabels" type="checkbox" checked>地点信息</label></div><small>倍率固定 1∶1 · 拖动或方向键浏览 · 悬停提亮，点击查看地点</small></header>
<aside><h2 id="name">玉虚仙宗</h2><div id="kind">宗门</div><div id="status">53处入口与地形同画 · 123处地点可交互</div></aside>
<footer><img id="mini" src="../../../textures/world/bai_chuan/joint_paint_v4/overview.png"><div id="frame"></div></footer>
<script src="map.js"></script><script>
const P=window.BAI_CHUAN_PRESENTATION,rows=P.placements,built=rows.filter(r=>r.hoverOnly),world=document.querySelector('#world'),view=document.querySelector('#view'),labels=document.querySelector('#labels'),highlight=document.querySelector('#highlight'),ctx=document.querySelector('#roads').getContext('2d');
const kinds={sect:'宗门',city:'城邑',town:'镇',market:'坊市',village:'村落',dock:'渡口',wild:'野外'},maskData={},buttons={};let camera=[0,0],hover='',information=true,drag=null,ready=false;
const hitRect=(p,r)=>p[0]>=r[0]&&p[0]<r[0]+r[2]&&p[1]>=r[1]&&p[1]<r[1]+r[3];
function clear(){hover='';highlight.style.display='none';for(const b of Object.values(buttons))b.classList.remove('active')}
function setHover(row){if(!information)return clear();if(hover===row.id)return;clear();hover=row.id;buttons[row.id].classList.add('active');if(row.hoverOnly){highlight.src=BAI_CHUAN_MASKS[row.id];Object.assign(highlight.style,{left:row.rect[0]+'px',top:row.rect[1]+'px',width:row.rect[2]+'px',height:row.rect[3]+'px',display:'block'})}}
function select(row){document.querySelector('#name').textContent=row.name;document.querySelector('#kind').textContent=kinds[row.type]||'野外'}
function update(){camera[0]=Math.max(0,Math.min(6144-innerWidth,camera[0]));camera[1]=Math.max(0,Math.min(6144-innerHeight,camera[1]));world.style.transform=`translate(${-camera[0]}px,${-camera[1]}px)`;const f=document.querySelector('#frame');Object.assign(f.style,{left:8+camera[0]/6144*180+'px',top:8+camera[1]/6144*180+'px',width:innerWidth/6144*180+'px',height:innerHeight/6144*180+'px'})}
function focus(name){const row=rows.find(r=>r.name===name);if(!row)return;clear();const r=row.rect;camera=[r[0]+r[2]/2-innerWidth/2,r[1]+r[3]/2-innerHeight/2];update();select(row)}
function hit(p){for(const r of built){if(!hitRect(p,r.rect))continue;const x=Math.floor(p[0]-r.rect[0]),y=Math.floor(p[1]-r.rect[1]),a=maskData[r.id];if(a&&a[(y*r.rect[2]+x)*4+3]>30)return r;}return rows.find(r=>!r.hoverOnly&&hitRect(p,r.rect))}
for(const row of rows){const b=document.createElement('button');b.textContent=row.name;b.dataset.id=row.id;const r=row.labelRect;Object.assign(b.style,{left:r[0]+'px',top:r[1]+'px',width:r[2]+'px',height:r[3]+'px',fontSize:row.labelSize+'px'});b.onpointerenter=()=>setHover(row);b.onpointerleave=clear;b.onclick=()=>select(row);labels.append(b);buttons[row.id]=b;const o=document.createElement('option');o.value=row.name;o.textContent=row.name;document.querySelector('#jump').append(o);if(!row.hoverOnly){const n=document.createElement('i');n.className='natural';n.style.left=(row.rect[0]+row.rect[2]/2-4)+'px';n.style.top=(row.rect[1]+row.rect[3]/2-4)+'px';labels.append(n)}}
function blocked(a,b,r){const d=[b[0]-a[0],b[1]-a[1]];let lo=0,hi=1;for(let k=0;k<2;k++){if(Math.abs(d[k])<1e-9){if(a[k]<r[k]||a[k]>r[k]+r[k+2])return null;continue}let u=(r[k]-a[k])/d[k],v=(r[k]+r[k+2]-a[k])/d[k];lo=Math.max(lo,Math.min(u,v));hi=Math.min(hi,Math.max(u,v));if(hi<=lo)return null}return[lo,hi]}
function roads(){ctx.clearRect(0,0,6144,6144);const masks=[];for(const r of rows){if(information||r.hoverOnly)masks.push([r.rect[0]-6,r.rect[1]-6,r.rect[2]+12,r.rect[3]+12]);if(information)masks.push([r.labelRect[0]-3,r.labelRect[1]-3,r.labelRect[2]+6,r.labelRect[3]+6])}ctx.lineWidth=1.7;ctx.strokeStyle='#65533dbb';ctx.beginPath();let strokes=0;for(const points of [...BAI_CHUAN_ROADS,...rows.filter(r=>r.approach).map(r=>r.approach)]){let distance=0;for(let i=1;i<points.length;i++){const a=points[i-1],b=points[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<.001)continue;let pos=0;while(pos<len-.001){const phase=distance%17,drawing=phase<10,run=Math.min((drawing?10:17)-phase,len-pos);if(run<.0001){pos+=.0001;distance+=.0001;continue}if(drawing){const s=[a[0]+dx*pos/len,a[1]+dy*pos/len],t=[a[0]+dx*(pos+run)/len,a[1]+dy*(pos+run)/len];let spans=[[0,1]];for(const r of masks){const q=blocked(s,t,r);if(!q)continue;spans=spans.flatMap(v=>q[1]<=v[0]||q[0]>=v[1]?[v]:[[v[0],Math.min(v[1],q[0])],[Math.max(v[0],q[1]),v[1]]].filter(v=>v[1]>v[0]));if(!spans.length)break}for(const v of spans){ctx.moveTo(s[0]+(t[0]-s[0])*v[0],s[1]+(t[1]-s[1])*v[0]);ctx.lineTo(s[0]+(t[0]-s[0])*v[1],s[1]+(t[1]-s[1])*v[1]);strokes++}}pos+=run;distance+=run}}}ctx.stroke();window.roadStrokeCount=strokes}
view.onpointerdown=e=>{if(e.target.tagName==='BUTTON')return;drag={x:e.clientX,y:e.clientY,camera:[...camera],moved:false};view.setPointerCapture(e.pointerId)};
view.onpointermove=e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=drag.moved||Math.abs(dx)+Math.abs(dy)>4;camera=[drag.camera[0]-dx,drag.camera[1]-dy];clear();update();return}const label=e.target.closest('button[data-id]');const row=information?(label?rows.find(r=>r.id===label.dataset.id):hit([e.clientX+camera[0],e.clientY+camera[1]])):null;view.style.cursor=row?'pointer':'grab';if(row)setHover(row);else clear()};
view.onpointerup=e=>{if(drag&&!drag.moved&&information){const row=hit([e.clientX+camera[0],e.clientY+camera[1]]);if(row)select(row)}drag=null};view.onpointerleave=()=>{if(!drag)clear()};
document.querySelector('#showLabels').onchange=e=>{information=e.target.checked;labels.style.display=information?'block':'none';clear();roads()};document.querySelector('#showRoads').onchange=e=>document.querySelector('#roads').style.display=e.target.checked?'block':'none';
document.querySelector('#jump').onchange=e=>focus(e.target.value);for(const b of document.querySelectorAll('[data-name]'))b.onclick=()=>focus(b.dataset.name);document.querySelector('#mini').onclick=e=>{const r=e.target.getBoundingClientRect();camera=[(e.clientX-r.left)/180*6144-innerWidth/2,(e.clientY-r.top)/180*6144-innerHeight/2];clear();update()};
window.onkeydown=e=>{const moves={ArrowLeft:[-90,0],ArrowRight:[90,0],ArrowUp:[0,-90],ArrowDown:[0,90]};if(moves[e.key]){e.preventDefault();camera[0]+=moves[e.key][0];camera[1]+=moves[e.key][1];clear();update()}};window.onresize=update;
Promise.all(built.map(row=>new Promise(resolve=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=i.width;c.height=i.height;const x=c.getContext('2d');x.drawImage(i,0,0);maskData[row.id]=x.getImageData(0,0,i.width,i.height).data;resolve()};i.src=BAI_CHUAN_MASKS[row.id]}))).then(()=>{roads();focus('玉虚仙宗');ready=true;window.JOINT_MAP_READY=true});
window.JOINT_MAP={rows,built,focus,hit,get hover(){return hover},get camera(){return camera},maskData};
</script></html>
