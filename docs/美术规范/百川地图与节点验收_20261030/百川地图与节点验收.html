<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百川 · 地图与节点验收</title><link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}body{margin:0;background:#d9d1ad;color:#34392f;font:14px 'Microsoft YaHei',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #a69c77;background:#eee7ce;color:#374034;padding:8px 13px;border-radius:5px}button:hover,button.active{background:#54624f;color:#fff9e8}header{height:68px;display:flex;align-items:center;gap:16px;padding:0 22px;background:#374737;color:#f4edce;box-shadow:0 2px 8px #0002}h1{font:26px Georgia,serif;letter-spacing:5px;margin:0}header small{opacity:.8}header .spacer{flex:1}.layout{height:calc(100vh - 68px);display:grid;grid-template-columns:252px 1fr}aside{background:#eae2c5;border-right:1px solid #aca17c;display:flex;flex-direction:column;min-height:0}.intro{padding:17px 16px 10px;line-height:1.8;color:#65705b}.intro strong{color:#3a4636}.controls{padding:4px 14px 12px;display:grid;gap:9px;border-bottom:1px solid #c1b794}.controls input[type=search],select{width:100%;padding:8px;border:1px solid #b4a985;background:#f8f2dd;color:#374034;border-radius:4px}.toggles{display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.list{flex:1;overflow:auto;padding:8px}.entry{width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}.entry small{font-size:11px;color:#738068}.entry.active small,.entry:hover small{color:inherit}.info{min-height:95px;padding:14px 16px;border-top:1px solid #c1b794;background:#e3d9b7;line-height:1.8}.info b{font-size:17px}main{min-width:0;display:flex;flex-direction:column}.toolbar{min-height:52px;padding:8px 14px;display:flex;align-items:center;gap:8px;background:#e3dbbc;border-bottom:1px solid #b5aa86}.toolbar .hint{margin-left:auto;font-size:12px;color:#63715c}#viewport{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#bfc5b2}#viewport.dragging{cursor:grabbing}#world{position:absolute;width:3762px;height:3762px;transform-origin:0 0;will-change:transform}#map{display:block;width:3762px;height:3762px;pointer-events:none;user-select:none}#grid{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(90deg,transparent calc(33.333% - 1px),#694b2c88 33.333%,transparent calc(33.333% + 1px),transparent calc(66.666% - 1px),#694b2c88 66.666%,transparent calc(66.666% + 1px)),linear-gradient(transparent calc(33.333% - 1px),#694b2c88 33.333%,transparent calc(33.333% + 1px),transparent calc(66.666% - 1px),#694b2c88 66.666%,transparent calc(66.666% + 1px))}.site{position:absolute;padding:0;border:0;border-radius:0;background:transparent;cursor:pointer;z-index:2}.site:hover,.site.active{background:transparent}.site img{display:block;width:100%;height:100%;pointer-events:none}.site:hover img,.site.active img{filter:brightness(1.17) drop-shadow(0 0 3px #f8eeb9) drop-shadow(0 0 2px #4b542f)}.site.active:after{content:'';position:absolute;inset:-7px;border:2px solid #88622c;border-radius:50%;pointer-events:none}.wild{border:1px solid #65765788;width:12px;height:12px!important;border-radius:50%;background:#e3dab888}.name{position:absolute;z-index:3;font-size:22px;line-height:30px;text-align:center;white-space:nowrap;cursor:pointer;color:#35402f;text-shadow:1px 1px #eee6cc,-1px 1px #eee6cc,1px -1px #eee6cc,-1px -1px #eee6cc}.name.wildname{font-size:18px;color:#687359}.nonames .name{display:none}.nonodes .site,.nonodes .name{display:none}.status{position:absolute;right:14px;bottom:14px;pointer-events:none;background:#f4ecd4e8;padding:8px 12px;border:1px solid #a59b76;border-radius:4px;font-size:12px}.catalog{display:none;position:absolute;inset:0;background:#e6ddbd;overflow:auto;padding:22px}.catalog.open{display:block;z-index:10}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#f1e9cc;border:1px solid #b9ae86;border-radius:6px;overflow:hidden}.sample{height:190px;display:flex;align-items:center;justify-content:center;background-size:900px;background-position:center}.cardfooter{padding:13px 15px;line-height:1.8}.cardfooter small{color:#69735e}a{color:#445c3f}.error{color:#9b3e2c}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#dcd4b7;z-index:20;font-size:18px}@media(max-width:900px){.layout{grid-template-columns:196px 1fr}.toolbar{flex-wrap:wrap}.toolbar .hint{display:none}header small{display:none}header{padding:0 12px;gap:10px}button{padding:7px 9px}}
</style>
<header><h1>百川舆图</h1><small>地图与节点 · 独立验收预览</small><span class="spacer"></span><button id="showmap">查看地图</button><button id="showassets">素材与大小</button><a href="百川地图验收包.zip" style="color:#efe5c2">下载验收包</a></header>
<div class="layout"><aside><div class="intro"><strong>三座大宗，各有山门</strong><br>其余地点按类型共用贴图。<br>选择地点可查看实际大小。</div><div class="controls"><input id="search" type="search" placeholder="查找地点"><select id="category"><option value="all">全部地点 · 123</option><option value="main">一级势力 · 3</option><option value="sect">宗门 · 13</option><option value="city">城市 · 16</option><option value="town">镇 · 14</option><option value="market">坊市 · 5</option><option value="village">村落 · 3</option><option value="dock">渡口 · 2</option><option value="wild">自然地点 · 70</option></select><div class="toggles"><label><input id="names" type="checkbox" checked>名称</label><label><input id="nodes" type="checkbox" checked>节点</label><label><input id="natural" type="checkbox">自然地点</label><label><input id="tiles" type="checkbox">九宫格</label></div></div><div class="list" id="list"></div><div class="info" id="info"><b>浏览百川</b><br>拖动地图平移；点击地点查看。<br>贴图大小请用“实际尺寸”检查。</div></aside>
<main><div class="toolbar"><button id="fit">全图</button><button id="actual">实际尺寸</button><button data-main="玉虚仙宗">玉虚</button><button data-main="玄都天府">玄都</button><button data-main="无相圣宗">无相</button><select id="region" style="width:115px"><option value="">跳至九区</option><option value="0,0">西北</option><option value="1,0">北中</option><option value="2,0">东北</option><option value="0,1">西中</option><option value="1,1">中央</option><option value="2,1">东中</option><option value="0,2">西南</option><option value="1,2">南中</option><option value="2,2">东南</option></select><span class="hint">拖动浏览 · 双击切换全图与实际尺寸</span></div>
<div id="viewport"><div id="world"><img id="map" draggable="false"><div id="grid"></div></div><div id="loading">正在展开舆图…</div><div class="status" id="status"></div><div class="catalog" id="catalog"><h2 style="font-weight:normal;margin-top:0">九类贴图 · 按实际像素展示</h2><p>一级势力宽100像素；二级宗门72，城87，镇61，坊市58，村44，渡口47。名称单独显示。</p><div class="cards" id="cards"></div></div></div></main></div>
<script src="presentation.js"></script><script>
const D=window.MAP_REVIEW, S=D.worldSize, $=id=>document.getElementById(id), V=$('viewport'), W=$('world');
let scale=1,tx=0,ty=0,selected=null,drag=null;const siteEls=new Map(),labelEls=new Map();
function apply(){W.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`;$('status').textContent=scale===1?'实际尺寸 · 1个图像像素对应1个显示像素':`全图浏览 · ${Math.round(scale*100)}%`;}
function center(x,y,s=scale){scale=s;tx=V.clientWidth/2-x*scale;ty=V.clientHeight/2-y*scale;apply();}
function fit(){center(S/2,S/2,Math.min(V.clientWidth/S,V.clientHeight/S));}
function actual(){const p=selected?.drawPos||[(V.clientWidth/2-tx)/scale,(V.clientHeight/2-ty)/scale];center(...p,1);}
function select(n,focus=true){if(n.type==='wild')$('natural').checked=true;const cat=$('category').value;if(cat!=='all'&&cat!==n.type&&!(cat==='main'&&n.type==='sect'&&n.level===1))$('category').value='all';if($('search').value&&!n.name.includes($('search').value.trim()))$('search').value='';selected=n;update();siteEls.forEach((e,id)=>e.classList.toggle('active',id===n.id));document.querySelectorAll('.entry').forEach(e=>e.classList.toggle('active',e.dataset.id===n.id));$('info').replaceChildren();const b=document.createElement('b');b.textContent=n.name;$('info').append(b,document.createElement('br'),n.type==='sect'?(n.level===1?'一级势力 · 独立山门':'二级宗门 · 共用模板'):n.typeLabel);if(n.asset){$('info').append(document.createElement('br'),`贴图 ${n.width} × ${n.height} 像素`);}else $('info').append(document.createElement('br'),'自然地貌保留在底图中');$('catalog').classList.remove('open');if(focus)center(n.drawPos[0],n.drawPos[1]-35,1);window.reviewSelected=n.id;}
function visible(n){const cat=$('category').value;return(!n.asset?$('natural').checked||cat==='wild':true)&&(cat==='all'||cat==='main'&&n.type==='sect'&&n.level===1||cat===n.type);}
function update(){const term=$('search').value.trim();const items=D.nodes.filter(n=>(!term||n.name.includes(term))&&($('category').value==='all'||$('category').value==='main'&&n.type==='sect'&&n.level===1||n.type===$('category').value));$('list').replaceChildren();items.forEach(n=>{const b=document.createElement('button');b.className='entry';b.dataset.id=n.id;b.classList.toggle('active',selected?.id===n.id);const span=document.createElement('span'),small=document.createElement('small');span.textContent=n.name;small.textContent=n.typeLabel;b.append(span,small);b.onclick=()=>select(n);$('list').append(b);});D.nodes.forEach(n=>{const show=visible(n);siteEls.get(n.id).style.display=show?'':'none';labelEls.get(n.id).style.display=show?'':'none';});W.classList.toggle('nonames',!$('names').checked);W.classList.toggle('nonodes',!$('nodes').checked);$('grid').style.display=$('tiles').checked?'block':'none';}
for(const n of D.nodes){const b=document.createElement('button');b.className='site'+(!n.asset?' wild':'');b.dataset.node=n.id;b.title=n.name;b.setAttribute('aria-label',n.name);if(n.asset){b.style.cssText=`left:${n.rect[0]}px;top:${n.rect[1]}px;width:${n.width}px;height:${n.height}px`;const img=new Image();img.src=n.src;img.draggable=false;b.append(img);}else b.style.cssText=`left:${n.drawPos[0]-6}px;top:${n.drawPos[1]-6}px`;b.onclick=e=>{e.stopPropagation();select(n,false);};W.append(b);siteEls.set(n.id,b);const l=document.createElement('div');l.className='name'+(!n.asset?' wildname':'');l.style.cssText=`left:${n.labelRect[0]}px;top:${n.labelRect[1]}px;width:${n.labelRect[2]-n.labelRect[0]}px`;l.textContent=n.name;l.onclick=e=>{e.stopPropagation();select(n,false);};W.append(l);labelEls.set(n.id,l);}
for(const a of D.assets){const card=document.createElement('div');card.className='card';const sample=document.createElement('div');sample.className='sample';sample.style.backgroundImage=`url(${D.background})`;const img=new Image();img.src=a.src;img.width=a.width;img.height=a.height;sample.append(img);const foot=document.createElement('div');foot.className='cardfooter';foot.textContent=a.id==='local_dao'?'二级宗门共用':a.name;const small=document.createElement('small');small.textContent=`${a.width} × ${a.height} 像素 · 透明贴图`;foot.append(document.createElement('br'),small);card.append(sample,foot);$('cards').append(card);}
$('map').onload=()=>{$('loading').style.display='none';fit();};$('map').onerror=()=>{$('loading').classList.add('error');$('loading').textContent='底图加载失败，请保持验收包的目录结构。';};$('map').src=D.background;
['search','category','names','nodes','natural','tiles'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',update));$('fit').onclick=fit;$('actual').onclick=actual;$('showmap').onclick=()=>$('catalog').classList.remove('open');$('showassets').onclick=()=>$('catalog').classList.add('open');document.querySelectorAll('[data-main]').forEach(b=>b.onclick=()=>select(D.nodes.find(n=>n.name===b.dataset.main)));$('region').onchange=e=>{if(!e.target.value)return;const [c,r]=e.target.value.split(',').map(Number);center((c+.5)*1254,(r+.5)*1254,1);};
V.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('.site,.name,.catalog'))return;drag={x:e.clientX,y:e.clientY,tx,ty};V.setPointerCapture(e.pointerId);V.classList.add('dragging');});V.addEventListener('pointermove',e=>{if(!drag)return;tx=drag.tx+e.clientX-drag.x;ty=drag.ty+e.clientY-drag.y;apply();});V.addEventListener('pointerup',()=>{drag=null;V.classList.remove('dragging');});V.addEventListener('dblclick',e=>{if(e.target.closest('.site,.name,.catalog'))return;scale===1?fit():actual();});V.addEventListener('wheel',e=>{if(!e.target.closest('.catalog'))e.preventDefault();},{passive:false});window.addEventListener('resize',()=>{if(scale!==1)fit();});window.reviewState=()=>({nodes:D.nodes.length,built:D.nodes.filter(n=>n.asset).length,assets:D.assets.length,scale,selected:selected?.id,loaded:[...document.images].filter(i=>!i.complete||!i.naturalWidth).length});update();
</script></html>
