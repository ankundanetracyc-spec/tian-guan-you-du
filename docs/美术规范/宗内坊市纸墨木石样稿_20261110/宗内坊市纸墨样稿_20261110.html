<body>
<main id="stage" class="browse" aria-label="宗内坊市纸墨木石样稿">

<script>
const items={
  mist:{name:'雾铃花',category:'材料',icon:'../../../textures/items/inventory_density_20261029/mat_mist_bell_flower.png',price:2,count:1,source:'随身'},

  scale:{name:'赤鳞蜕',category:'材料',icon:'../../../textures/items/inventory_density_20261029/mat_red_scale_shed.png',price:3,count:1,source:'储物空间'},
  agility:{name:'轻身丹·良效',category:'丹药',icon:'../../../textures/items/inventory_density_20261029/pill_container_empty_porcelain.png',price:6,count:1,source:'储物空间'},
  root:{name:'苦苔根',category:'材料',icon:'../../../textures/items/inventory_density_20261029/bitter_moss_root_2x4.png',price:2,count:1,source:'随身'},
  ore:{name:'铜髓矿',category:'材料',icon:'../../../textures/items/inventory_density_20261029/mat_tong_sui_ore.png',price:3,count:1,source:'储物空间'},
  bone:{name:'兽骨',category:'材料',icon:'../../../textures/items/inventory_density_20261029/mat_beast_bone.png',price:3,count:1,source:'随身'},
  hide:{name:'兽皮',category:'材料',icon:'../../../textures/items/inventory_density_20261029/mat_beast_hide.png',price:3,count:1,source:'储物空间'}
};
const stalls=[
 {name:'甲字摊',owner:'同门',keys:['mist','pill','scale','agility']},
 {name:'乙字摊',owner:'同门',keys:['root','ore','pill']},
 {name:'丙字摊',owner:'同门',keys:['bone','mist','agility']},
 {name:'丁字摊',owner:'同门',keys:['hide','pill','scale']}
];
const stage=document.getElementById('stage');let selected={stall:0,key:'mist'},quantity=1,category='全部',toastTimer;
const $=id=>document.getElementById(id);
function fit(){const scale=Math.min(innerWidth/1672,innerHeight/941);stage.style.setProperty('--scale',scale)}
function choose(stallIndex,key){selected={stall:stallIndex,key};quantity=1;renderBrowse()}
function renderBrowse(){const area=$('stallColumns');area.replaceChildren();const term=$('searchInput').value.trim();stalls.forEach((stall,i)=>{const column=document.createElement('section');column.className='stall';const pos=[104,496,860,1231][i],width=[350,320,328,337][i];column.style.left=pos+'px';column.style.width=width+'px';column.innerHTML=`<header class="stall-header"><h2>${stall.name}</h2><span class="custody">坊市代管</span><div class="owner">寄售人 · ${stall.owner}</div></header><div class="column-head"><span>货物</span><span>数量</span><span>单价</span></div><div class="rows"></div><div class="stall-note"><span>${stall.keys.length} 种货物</span><strong>成员寄售</strong></div>`;const list=column.querySelector('.rows');stall.keys.forEach(key=>{const item=items[key];if((category!=='全部'&&item.category!==category)||(term&&!item.name.includes(term)))return;const row=document.createElement('button');row.className='item-choice';row.classList.toggle('is-selected',selected.stall===i&&selected.key===key);row.setAttribute('aria-label',`${item.name}，${item.count}件，单价${item.price}灵石`);row.innerHTML=`<img src="${item.icon}" alt=""><span class="name">${item.name}</span><span class="qty">${item.count}</span><span class="price">${item.price}<small>灵石</small></span>`;row.onclick=()=>choose(i,key);list.append(row)});if(!list.children.length)list.innerHTML='<p class="empty-row">暂无相符货物</p>';area.append(column)});const item=items[selected.key],stall=stalls[selected.stall];$('chosenIcon').src=item.icon;$('chosenText').innerHTML=`${stall.name} · ${item.name}<small>单价 ${item.price} 灵石 · 摊上余 ${item.count} 件</small>`;$('quantity').textContent=quantity;$('total').textContent=item.price*quantity;$('less').disabled=quantity<=1;$('more').disabled=quantity>=item.count}
function buildGrid(){const grid=$('stallGrid'),places=[{key:'mist',column:1,row:1,width:2,height:4,count:'1件'},{key:'pill',column:3,row:1,width:1,height:2,count:'2颗'},{key:'scale',column:4,row:1,width:2,height:3,count:'1件'},{key:'ore',column:7,row:1,width:3,height:3,count:'1件'}];places.forEach(place=>{const item=items[place.key],card=document.createElement('div');card.className='placed';card.style.gridColumn=place.column+' / span '+place.width;card.style.gridRow=place.row+' / span '+place.height;card.title=item.name+' · '+item.price+'灵石';card.innerHTML='<img src="'+item.icon+'" alt=""><small>'+place.count+'</small>';grid.append(card)})}function renderInventory(){const list=$('inventoryList'),term=$('inventorySearchInput').value.trim(),source=document.querySelector('[data-source].is-selected')?.dataset.source||'全部';list.replaceChildren();Object.entries(items).forEach(([key,item])=>{if((source!=='全部'&&source!==item.source)||(term&&!item.name.includes(term)))return;const row=document.createElement('button');row.className='inventory-row';row.classList.toggle('is-selected',key==='scale');row.innerHTML=`<img src="${item.icon}" alt=""><span>${item.name}</span><span class="count">${item.count} 件</span>`;list.append(row)})}
function setPage(page){const isBrowse=page==='browse';stage.classList.toggle('browse',isBrowse);stage.classList.toggle('mine',!isBrowse);$('browseTab').classList.toggle('is-selected',isBrowse);$('mineTab').classList.toggle('is-selected',!isBrowse);$('modeNote').textContent=isBrowse?'同门互市 · 灵石交易':'租金 1 灵石 / 游戏月 · 不自动续租';$('categoryTabs').hidden=!isBrowse;$('marketSearch').hidden=!isBrowse;$('inventorySearch').hidden=isBrowse;$('stallColumns').hidden=!isBrowse;$('selectionBar').hidden=!isBrowse;$('mineHead').hidden=isBrowse;$('mineBody').hidden=isBrowse;renderInventory()}
function openDialog(title,body,onConfirm){$('dialogTitle').textContent=title;$('dialogBody').textContent=body;$('shade').hidden=false;$('confirm').onclick=()=>{closeDialog();if(onConfirm)onConfirm()}}
function closeDialog(){$('shade').hidden=true}
function toast(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1800)}
$('browseTab').onclick=()=>setPage('browse');$('mineTab').onclick=()=>setPage('mine');$('searchInput').oninput=renderBrowse;$('inventorySearchInput').oninput=renderInventory;
document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{category=button.dataset.category;document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('is-selected',x===button));renderBrowse()});
document.querySelectorAll('[data-source]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-source]').forEach(x=>x.classList.toggle('is-selected',x===button));renderInventory()});
$('less').onclick=()=>{quantity=Math.max(1,quantity-1);renderBrowse()};$('more').onclick=()=>{quantity=Math.min(items[selected.key].count,quantity+1);renderBrowse()};
$('buy').onclick=()=>openDialog('确认购买',`${stalls[selected.stall].name} · ${items[selected.key].name} × ${quantity}\n共需 ${items[selected.key].price*quantity} 灵石，成交消耗 1 点精力。`,()=>toast('视觉样稿：未实际成交'));
$('back').onclick=()=>openDialog('返回和光峰','结束本次逛坊。',()=>toast('视觉样稿：返回入口'));
$('claim').onclick=()=>openDialog('领取所得','领取摊位售得的 6 枚灵石？',()=>toast('视觉样稿：未写入资产'));
$('closeStall').onclick=()=>openDialog('结束摆摊','未售物品与所得仍可领取，已付租金不退。',()=>toast('视觉样稿：未改变租约'));
$('cancel').onclick=closeDialog;$('shade').onclick=event=>{if(event.target===$('shade'))closeDialog()};addEventListener('keydown',event=>{if(event.key==='Escape')closeDialog()});addEventListener('resize',fit);buildGrid();renderBrowse();renderInventory();fit();if(location.hash==='#mine')setPage('mine');
</script>
</body>
</html>
