<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>百川 · 通用节点模板试阅</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><style>*{box-sizing:border-box}body{margin:0;background:#e1d3b8;color:#4f4435;font-family:"Microsoft YaHei",sans-serif}header,section{max-width:1580px;margin:auto;padding:18px 22px}h1{font-family:KaiTi,serif;font-size:30px;font-weight:normal;margin:0 0 8px}p{line-height:1.7}header p{margin:4px 0;font-size:14px}label{display:inline-block;margin:8px 0}.viewer{width:100%;overflow:auto;border:1px solid #ac9876;background:#c3ac83}.stage{position:relative;width:1536px;height:1024px}.base{display:block;width:1536px;height:1024px}.node{position:absolute;object-fit:contain;pointer-events:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}.card{text-align:center;padding:20px;background:#c9b48b;color:inherit;text-decoration:none}.card img{width:auto;max-width:100%;height:160px;object-fit:contain}.foot{font-size:13px;color:#7d6d56}@media(max-width:700px){.cards{grid-template-columns:1fr}.card img{height:140px}}</style><header><h1>百川 · 简笔底图与通用节点模板</h1><p>仅试画风：左为宗门，中为城池，右为镇集。地形、建筑各为独立图片，未采用参考截图的地图布局、路线、人物或界面。</p><label><input id="nodes" type="checkbox" checked>显示三个节点模板</label><p>底图按原像素显示；窄窗口可横向滚动，无放大操作。</p></header><section><div class="viewer"><div class="stage"><img class="base" src="通用地貌底图_v01.png" alt="通用地貌底图"><img class="node" src="宗门通用模板_v01.png" alt="宗门通用模板" style="left:329px;top:547px;width:140px;height:88px"><img class="node" src="城池通用模板_v01.png" alt="城池通用模板" style="left:704px;top:560px;width:128px;height:75px"><img class="node" src="镇集通用模板_v01.png" alt="镇集通用模板" style="left:1071px;top:572px;width:100px;height:63px"></div></div><div class="cards"><a class="card" href="宗门通用模板_v01.png"><img src="宗门通用模板_v01.png" alt="宗门通用模板"><p>宗门模板 · 透明PNG</p></a><a class="card" href="城池通用模板_v01.png"><img src="城池通用模板_v01.png" alt="城池通用模板"><p>城池模板 · 透明PNG</p></a><a class="card" href="镇集通用模板_v01.png"><img src="镇集通用模板_v01.png" alt="镇集通用模板"><p>镇集模板 · 透明PNG</p></a></div><p class="foot">单独模板为较大检视图；上方地图叠放宽度依次140、128、100像素。此页是通用样式试阅，不代表正式地点或九块底图已换稿。<a href="README.md">制作说明</a> · <a href="三个模板叠放效果_v01.png">叠放效果PNG</a></p></section><script>document.getElementById('nodes').addEventListener('change',e=>document.querySelectorAll('.node').forEach(n=>n.hidden=!e.target.checked));</script></html>
