<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画符 · 纸墨配伍</title><link rel="icon" href="data:,"><link rel="stylesheet" href="preview.css"></head>
<body>
  <header class="preview-tools"><strong>纸墨配伍旧布局参考</strong><span><a href="../../plans/符箓三工艺与画符技艺主案_20261108.md">查看当前三工艺与技艺规划</a></span><nav aria-label="样稿预览"><button data-preview="prepare">准备</button><button data-preview="drawing">演出</button><button data-preview="result">鉴看</button></nav><a href="README.md">说明</a></header>
  <div id="viewport"><main id="stage" aria-label="纸墨配伍画符工作台">
    <img class="room" src="../../../textures/ui/talisman_crafting_20261108/desk_v1.png" alt="水墨山亭中的画符案面">
    <canvas id="scene-canvas" width="1672" height="941" aria-label="当前符纸与自动行笔演示"></canvas>
    <div id="stone" class="stone asset-prop" aria-hidden="true"></div><div id="brush" class="brush asset-prop" aria-hidden="true"></div>
    <div id="prepare-layer">
      <header class="game-header skin" data-skin="wide"><button class="back btn" data-action="back">〈 返回</button><h1>画 符</h1><button class="btn recipe-current" data-action="recipes">符谱：炎矢符</button><button class="btn" data-action="notebook">配伍册</button><span class="proficiency">符箓造诣　—</span><button class="btn" data-action="help">功用说明</button></header>
      <section class="inputs skin" data-skin="tall" aria-label="符墨与符纸选材"><h2 id="input-heading">配墨</h2><p class="subheading" id="input-subheading">选择墨料与份数</p><nav id="role-tabs" aria-label="选材类别"></nav><div id="input-list" class="scroll-area"></div><footer class="input-footer"><button class="btn" data-action="clear">清空本页</button><button class="btn" id="add-button" data-action="add">＋ 添加墨料</button></footer></section>
      <section class="work-heading skin" data-skin="wide"><div><span id="work-stage">准 备</span><strong id="work-name">炎矢符</strong></div><span id="work-description">远程 · 单体敌人</span></section>
      <div class="work-tools"><button class="btn" data-action="brushes" id="brush-button">符笔：硬毫符笔　›</button><button class="btn" data-action="pairing">纸墨说明　›</button></div>
      <section class="work-bottom skin" data-skin="wide"><div class="input-utilities-head"><h3>本次纸墨</h3><span>备好材料，自动画符</span></div><dl class="pairing-summary"><div><dt>墨料</dt><dd id="ink-summary">—</dd></div><div><dt>纸材</dt><dd id="paper-summary">—</dd></div><div><dt>符笔</dt><dd id="brush-summary">—</dd></div></dl></section>
      <aside class="costs skin" data-skin="tall" aria-label="本次用度"><h2>本次用度</h2><dl class="resource-lines"><div><dt>可支配灵识</dt><dd>— / —</dd></div><div><dt>本次工艺需求</dt><dd>—</dd></div></dl><div class="meter" aria-label="工艺需求尚未标定"><span></span></div><h3>选材明细</h3><div id="cost-list" class="scroll-area"></div><dl class="cost-totals"><div><dt>墨料投入</dt><dd><span id="material-kinds">—</span> / <span id="material-total">—</span></dd></div><div><dt>符纸投入</dt><dd id="paper-total">—</dd></div><div><dt>所用符笔</dt><dd id="brush-total">—</dd></div><div><dt>工时</dt><dd>—</dd></div><div><dt>精力</dt><dd>—</dd></div></dl><p class="cost-condition">符效与成符张数，画成后鉴看。</p><button class="btn primary" id="start-button" data-action="start">开 始 画 符</button></aside>
    </div>
    <div class="scene-actions skin" data-skin="wide" id="scene-actions" hidden><span id="drawing-stage">研墨 · 调墨</span><button class="btn" data-action="skip">跳过演出</button></div>
    <section id="result-layer" hidden aria-label="成符鉴看"><div class="result-panel skin" data-skin="tall"><h2>成符鉴看</h2><div class="result-layout"><canvas id="result-canvas" width="280" height="420" aria-label="符箓外观示意"></canvas><div><h3 id="result-name">炎矢符</h3><p id="result-role">远程 · 单体敌人</p><dl><div><dt>符效</dt><dd>—</dd></div><div><dt>效果</dt><dd id="result-effect">数值待定</dd></div></dl><p class="result-note">仅演示自动制作，未计算真实成符。</p></div></div><button class="btn primary" data-action="finish">完 成 鉴 看</button></div></section>
    <div id="overlay-layer" hidden></div><div id="toast" class="skin" data-skin="jade" role="status" hidden></div>
  </main></div>
  <script src="catalog.js"></script><script src="preview.js"></script>
</body></html>
