<body>
<div id="stage">
  <h1 class="title">宗内坊市</h1><div class="draft">理想图 · 示例货单</div>
  <div class="toolbar">
    <button class="paper-button tab active" id="browse">逛坊市</button><button class="paper-button tab" id="mine">我的摊位</button>
    <span class="care-note">坊市代管 · 摊租含照看</span>
    <span class="drag-hint" id="dragHint">左右拖动查看摊位</span>
    <input class="search" id="search" aria-label="查找摊货" placeholder="查找摊货" autocomplete="off">
    <span class="balance"><img src="../../../textures/items/inventory_density_20261029/spirit_stone_1x1.png" alt="">灵石 <span id="wallet">18</span></span>
    <button class="paper-button back" id="back">返回</button>
  </div>
  <div class="rail-viewport" id="viewport" tabindex="0" role="region" aria-label="左右拖动浏览寄售摊位"><div class="rail" id="stalls"></div></div>
  <div class="selection" id="browseSelection">
    <img id="chosenIcon" class="chosen-icon" alt=""><div class="chosen-text" id="chosen"></div>
    <div class="quantity"><span>数量</span><button id="less" aria-label="减少购买数量">−</button><output id="quantity">1</output><button id="more" aria-label="增加购买数量">＋</button></div>
    <div class="total">共需 <strong id="total">2</strong> 灵石</div><button class="buy" id="buy">购买</button>
  </div>
  <div class="space-owner" id="ownerPane" hidden>
    <section class="inventory-sheet" aria-label="行囊与储物空间物品">
      <h2 class="space-heading">行囊物品</h2><p class="space-subtitle">含随身与储物空间内物品</p>
      <div class="source-tabs" role="group" aria-label="物品所在空间"><button class="source-tab active" id="scopeAll">全部物品</button><button class="source-tab" id="scopeBody">随身</button><button class="source-tab" id="scopeRing">储物空间</button></div>
      <div class="column-head"><span>物品</span><span>数量</span></div><div class="inventory-index" id="ownerInventory"></div>
      <div class="inventory-caption" id="ownerInventoryCaption">同物汇总数量，逐件移入摊位。<br>储物空间内物品可直接上架。</div>
    </section>
    <section class="spatial-sheet" aria-label="实际摊位空间与信息">
      <header class="space-header"><h2 class="space-heading">寄售空间</h2><span class="space-badge" id="ownerLeaseState">租用中</span><div class="space-usage">已用 <strong id="ownerUsed">27</strong> / 60 格<small>10 × 6</small></div></header>
      <div class="space-layout"><div>
        <div class="stall-grid" id="ownerGrid" role="group" aria-label="10列6行的实际摊位格子"><div class="placement-preview" id="ownerPlacement"></div><div class="grid-empty" id="ownerGridEmpty" hidden></div></div>
        <div class="space-grid-caption"><span>每件物品按实际占地摆放</span><span>R 旋转</span></div>
        <div class="space-message" id="ownerMessage" role="status"></div><div class="space-receipt" id="ownerReceipt"></div>
      </div><aside class="stall-information" aria-label="租期与所得">
        <div class="information-label" id="ownerTimeCaption">租期剩余</div><div class="lease-left" id="ownerTimeLeft">20 日</div><div class="lease-date" id="ownerExpiry">到期 · 1年2月1日0时</div><p class="reclaim-note" id="ownerReclaimNote"></p><button class="contract-link" id="ownerLease">查看租约</button>
        <div class="stall-money"><div class="information-label">售得灵石 · 待领取</div><div class="money-line"><img src="../../../textures/items/inventory_density_20261029/spirit_stone_1x1.png" alt=""><strong id="ownerPending">6</strong><span>灵石</span></div><button class="claim-button" id="ownerClaim">领取灵石</button><p class="stall-income-note" id="ownerIncomeNote">所得可在此领取。</p></div>
      </aside></div>
    </section>
  </div>
  <div class="selection owner-space-selection" id="ownerSelection" hidden>
    <img id="ownerChosenIcon" class="chosen-icon" alt=""><div class="chosen-text" id="ownerChosen"></div>
    <label class="owner-price">单价 <input id="ownerPrice" type="number" min="1" step="1" aria-label="灵石单价">灵石</label>
    <button class="paper-button rotate-piece" id="ownerRotate">旋转 · R</button><span class="planned-cells" id="ownerPlannedCells"></span>
    <button class="buy owner-primary" id="ownerPrimary">上架一件</button><button class="paper-button owner-withdraw" id="ownerWithdraw" hidden>取回物品</button>
  </div>
  <div class="drag-piece" id="ownerDragPiece"><img alt=""></div>
  <div class="bottom-note" id="bottomNote">成员寄存货物，由坊市照看 · 以灵石交易</div>
  <div class="hover-card" id="hover"></div>
  <div class="modal-shade" id="shade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="controls"><button class="paper-button" id="cancel">返回</button><button class="paper-button active" id="confirm">确认</button></div></div></div>
</div>

<script>
const $=id=>document.getElementById(id), stage=$('stage');
let source,selected=null,quantity=1,scale=1,drag=null,suppressClickUntil=0,modalAction=null;
const viewport=$('viewport');
function fit(){cancelDrag();scale=Math.min(innerWidth/1672,innerHeight/941);stage.style.transform=`scale(${scale})`;stage.style.left=`${(innerWidth-1672*scale)/2}px`;stage.style.top=`${(innerHeight-941*scale)/2}px`;hideHover()}
function imagePath(item){return '../../../'+item.icon.replace('res://','')}
function showHover(item,event){if(drag?.active)return;const box=$('hover');box.innerHTML=`<img src="${imagePath(item)}" alt=""><h3>${item.name}</h3><p>${item.category}<br>占格 ${item.width} × ${item.height}<br>单价 ${item.price} 灵石</p>`;const rect=stage.getBoundingClientRect();const x=(event.clientX-rect.left)/scale,y=(event.clientY-rect.top)/scale;box.style.left=`${Math.min(x+18,1380)}px`;box.style.top=`${Math.min(y+12,660)}px`;box.style.display='block'}
function hideHover(){$('hover').style.display='none'}
function choose(stall,row){selected={stall,row};quantity=1;renderSelection();for(const button of document.querySelectorAll('.item-row'))button.classList.toggle('selected',button.dataset.stall===stall.id&&button.dataset.path===row.path)}
function renderSelection(){if(!selected)return;const {stall,row}=selected;$('chosenIcon').src=imagePath(row);$('chosen').innerHTML=`${stall.name} · ${row.name}<small>单价 ${row.price} 灵石 · 剩余 ${row.quantity} 件</small>`;$('quantity').textContent=quantity;$('total').textContent=row.price*quantity;$('less').disabled=quantity<=1;$('more').disabled=quantity>=row.quantity}
function render(){const term=$('search').value.trim(),position=viewport.scrollLeft;hideHover();$('stalls').replaceChildren();source.stalls.forEach(stall=>{const column=document.createElement('section');column.className='stall';column.setAttribute('aria-label',stall.name);column.innerHTML=`<header class="stall-header"><h2>${stall.name}</h2><span class="custody">坊市代管</span><div class="owner">寄售人 · ${stall.owner}</div></header><div class="column-head"><span>货物</span><span>数量</span><span>灵石</span></div><div class="rows"></div><div class="stall-note"><span>${stall.rows.length} 种货物</span><span class="occupied">占用 <span>${stall.usedCells}</span> 格</span></div>`;const rows=column.querySelector('.rows');stall.rows.forEach(row=>{const button=document.createElement('button');button.className='item-row';button.dataset.stall=stall.id;button.dataset.path=row.path;button.setAttribute('aria-label',`${stall.name} ${row.name} ${row.quantity}件 单价${row.price}灵石`);button.innerHTML=`<span class="name">${row.name}</span><span class="count">${row.quantity}</span><span class="price">${row.price}</span>`;button.classList.toggle('selected',selected?.stall.id===stall.id&&selected?.row.path===row.path);button.classList.toggle('dim',term.length>0&&!row.name.includes(term));button.onclick=()=>choose(stall,row);button.onmouseenter=event=>showHover(row,event);button.onmousemove=event=>showHover(row,event);button.onmouseleave=hideHover;button.onblur=hideHover;rows.append(button)});$('stalls').append(column)});viewport.scrollLeft=position;$('dragHint').textContent=`左右拖动 · 共 ${source.stalls.length} 摊`}
function cancelDrag(){if(drag?.active){suppressClickUntil=performance.now()+200;if(viewport.hasPointerCapture(drag.id))viewport.releasePointerCapture(drag.id)}drag=null;viewport.classList.remove('dragging')}
viewport.addEventListener('pointerdown',event=>{if(event.button!==0||!event.isPrimary)return;drag={id:event.pointerId,x:event.clientX,y:event.clientY,scroll:viewport.scrollLeft,active:false}});
viewport.addEventListener('pointermove',event=>{if(!drag||event.pointerId!==drag.id)return;const dx=event.clientX-drag.x,dy=event.clientY-drag.y;if(!drag.active&&Math.abs(dx)>7&&Math.abs(dx)>Math.abs(dy)*1.2){drag.active=true;viewport.setPointerCapture(event.pointerId);viewport.classList.add('dragging');hideHover()}if(drag.active){viewport.scrollLeft=drag.scroll-dx/scale;event.preventDefault()}});
viewport.addEventListener('pointerup',event=>{if(drag?.id===event.pointerId)cancelDrag()});viewport.addEventListener('pointercancel',cancelDrag);viewport.addEventListener('lostpointercapture',()=>{drag=null;viewport.classList.remove('dragging')});
viewport.addEventListener('click',event=>{if(performance.now()<suppressClickUntil){event.preventDefault();event.stopImmediatePropagation()}},true);
viewport.addEventListener('wheel',event=>{if(event.shiftKey||Math.abs(event.deltaX)>Math.abs(event.deltaY)){viewport.scrollLeft+=(event.shiftKey&&Math.abs(event.deltaX)<1?event.deltaY:event.deltaX)/scale;hideHover();event.preventDefault()}},{passive:false});
viewport.addEventListener('scroll',hideHover);viewport.addEventListener('keydown',event=>{if(event.target===viewport&&['ArrowLeft','ArrowRight'].includes(event.key)){viewport.scrollLeft+=event.key==='ArrowLeft'?-94:94;event.preventDefault()}});addEventListener('blur',cancelDrag);
function modal(title,text,action=null){hideHover();modalAction=action;$('modalTitle').textContent=title;$('modalText').textContent=text;$('shade').style.display='flex'}
function closeModal(){$('shade').style.display='none';modalAction=null}
$('search').oninput=render;$('less').onclick=()=>{quantity=Math.max(1,quantity-1);renderSelection()};$('more').onclick=()=>{quantity=Math.min(selected.row.quantity,quantity+1);renderSelection()};
$('buy').onclick=()=>modal('确认购买',`${selected.stall.name} · ${selected.row.name} ×${quantity}\n共需 ${selected.row.price*quantity} 灵石，消耗 1 点精力。`);
$('mine').onclick=()=>modal('租用摊位','租金：1 灵石 / 游戏月，包含坊市代管。\n租期三十日，到期不自动续租。');
$('back').onclick=()=>modal('返回和光峰','结束本次逛坊。');$('browse').onclick=()=>{viewport.scrollLeft=0;$('search').value='';render()};$('cancel').onclick=closeModal;$('confirm').onclick=()=>{const action=modalAction;closeModal();action?.()};
addEventListener('resize',fit);addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});
source=window.marketListsSample;choose(source.stalls[0],source.stalls[0].rows[0]);render();fit();window.previewReady=true;
</script>
