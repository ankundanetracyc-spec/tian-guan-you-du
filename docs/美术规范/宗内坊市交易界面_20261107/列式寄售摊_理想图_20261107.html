<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>玉虚宗内坊市 · 列式寄售摊理想图</title>

<style>
@font-face{font-family:Zhenkai;src:url('../../../resources/font/LXGWZhenKaiSlabGB-Regular.ttf')}
:root{--ink:#354034;--muted:#727966;--green:#667d61;--line:#b3a48a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#51594f;font-family:Zhenkai,serif;color:var(--ink)}
button,input{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.42}
#stage{position:absolute;width:1672px;height:941px;transform-origin:0 0;background:url('../../../textures/ui/yuxu_market_20261107/market_ledger_frame_v1.png') center/100% 100% no-repeat}
.title{position:absolute;left:559px;top:25px;width:554px;height:92px;display:grid;place-items:center;font-size:45px;font-weight:normal;letter-spacing:9px;margin:0}
.draft{position:absolute;right:111px;top:119px;font-size:14px;color:#dbd7c8;letter-spacing:1px}
.toolbar{position:absolute;left:95px;top:158px;width:1482px;height:48px;display:flex;align-items:center;gap:8px}
.paper-button{height:35px;padding:2px 19px;border:1px solid #a79b82;background:#eee6d5;box-shadow:inset 0 1px #fff8e8;font-size:21px;white-space:nowrap}
.paper-button.active{background:#ced7c0;border-color:#87927b}.paper-button:hover:not(:disabled){background:#dae0ce}
.tab{width:119px}.care-note{position:absolute;left:269px;top:12px;font-size:18px;color:#66715e;letter-spacing:.5px}
.browse-nav{position:absolute;left:622px;top:6px;display:flex;align-items:center;gap:7px}
.browse-nav button{padding:0;width:34px;font-size:28px;line-height:28px}.browse-range{width:125px;text-align:center;font-size:18px}
.search{position:absolute;left:857px;top:7px;width:225px;height:34px;padding:4px 10px;border:1px solid #c2b79f;outline:0;background:#f6efdf;font-size:18px}.search:focus{border-color:#71856d}
.balance{position:absolute;left:1117px;top:10px;width:220px;text-align:right;font-size:22px;display:flex;justify-content:flex-end;align-items:center;gap:8px}.balance img{width:22px;height:24px;object-fit:contain}
.back{position:absolute;right:9px;top:6px;width:91px;padding:0}
.stall{position:absolute;top:254px;height:554px;display:flex;flex-direction:column;padding:0 5px}
.stall-header{height:61px;flex:none;position:relative;padding:1px 10px 0}
.stall-header h2{font-size:28px;font-weight:normal;line-height:34px;letter-spacing:3px;margin:0}
.owner{font-size:16px;color:#7d7969;line-height:25px}.custody{position:absolute;right:11px;top:5px;color:#6c7c64;font-size:16px;border:1px solid #a4af95;background:#d9dfcc9c;padding:1px 8px}
.column-head{height:37px;flex:none;margin:0 6px;display:grid;grid-template-columns:minmax(0,1fr) 44px 49px;align-items:center;border-bottom:1px solid #c4b499;padding:0 8px;font-size:18px;color:#6b715f}
.column-head span:not(:first-child){text-align:right}.rows{height:387px;flex:none;overflow-y:auto;margin:0 6px;scrollbar-width:thin;scrollbar-color:#a19a82 #ddd3bd50}
.rows::-webkit-scrollbar{width:4px}.rows::-webkit-scrollbar-thumb{background:#a19a82}
.item-row{position:relative;width:100%;min-height:48px;display:grid;grid-template-columns:minmax(0,1fr) 44px 49px;align-items:center;gap:0;padding:0 8px;border:0;border-bottom:1px solid #bfae8e66;background:transparent;font-size:21px;text-align:left}
.item-row:hover{background:#dce2d153}.item-row.selected{background:#ced9bd9c;box-shadow:inset 3px 0 #6f8266}
.item-row .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:5px}.item-row .count,.item-row .price{text-align:right;font-size:20px}.item-row .price{color:#405340}
.item-row.dim{opacity:.26}.item-row:focus-visible{outline:1px solid #6e8264;outline-offset:-2px}
.empty{padding:25px 10px;color:#8d8c76;font-size:18px}.stall-note{flex:1;display:flex;align-items:end;justify-content:space-between;font-size:16px;color:#737c67;padding:0 13px 7px;white-space:nowrap}
.stall-note .occupied{color:#6c725f}.stall-note .occupied span{font-size:20px;color:#465941}
.selection{position:absolute;left:97px;top:852px;width:1480px;height:45px;display:flex;align-items:center}
.chosen-icon{width:38px;height:38px;object-fit:contain;margin-right:13px}.chosen-text{width:634px;font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chosen-text small{display:block;font-size:16px;line-height:20px;color:#7c7b67;margin-top:3px}
.quantity{position:absolute;left:830px;top:4px;display:flex;align-items:center;gap:10px;font-size:20px}.quantity button{width:30px;height:31px;border:1px solid #aaa48e;background:#f4eedf;font-size:22px;padding:0}.quantity output{width:29px;text-align:center}
.total{position:absolute;right:198px;top:9px;font-size:21px;white-space:nowrap}.total strong{font-weight:normal;font-size:27px}
.buy{position:absolute;right:15px;top:1px;width:165px;height:42px;background:#6d8166;border:1px solid #586f52;box-shadow:inset 0 1px #a4b295;color:#f4f0e1;font-size:25px;letter-spacing:4px}.buy:hover:not(:disabled){background:#788e70}
.bottom-note{position:absolute;left:109px;bottom:12px;font-size:14px;color:#d3d4c7;letter-spacing:1px;text-shadow:0 1px #30382d}
.hover-card{position:absolute;z-index:20;display:none;pointer-events:none;width:258px;padding:16px;background:#f4ecdb;border:2px solid #8e8b70;box-shadow:0 5px 12px #2f312d55}.hover-card img{width:78px;height:89px;object-fit:contain;float:right;margin-left:10px}.hover-card h3{font-size:25px;font-weight:normal;margin:0 0 10px}.hover-card p{font-size:18px;color:#6b725f;line-height:1.6;margin:0}
.modal-shade{position:absolute;inset:0;background:#25302777;z-index:30;display:none;align-items:center;justify-content:center}.modal{width:540px;background:#f0e8d7;border:4px solid #817b61;box-shadow:0 7px 30px #1f261f55;padding:29px 33px}.modal h2{font-weight:normal;font-size:30px;margin:0 0 21px}.modal p{font-size:22px;line-height:1.65;margin:0 0 26px}.modal .controls{display:flex;justify-content:flex-end;gap:18px}.modal button{height:42px;font-size:22px}
</style>
</head>
<body>
<div id="stage">
  <h1 class="title">宗内坊市</h1><div class="draft">理想图 · 示例货单</div>
  <div class="toolbar">
    <button class="paper-button tab active" id="browse">逛坊市</button><button class="paper-button tab" id="mine">我的摊位</button>
    <span class="care-note">坊市代管 · 摊租含照看</span>
    <div class="browse-nav"><button class="paper-button" id="previous" aria-label="查看前面的摊位">‹</button><span class="browse-range" id="range"></span><button class="paper-button" id="next" aria-label="查看后面的摊位">›</button></div>
    <input class="search" id="search" aria-label="查找摊货" placeholder="查找摊货" autocomplete="off">
    <span class="balance"><img src="../../../textures/items/inventory_density_20261029/spirit_stone_1x1.png" alt="">灵石 <span>18</span></span>
    <button class="paper-button back" id="back">返回</button>
  </div>
  <div id="stalls"></div>
  <div class="selection">
    <img id="chosenIcon" class="chosen-icon" alt=""><div class="chosen-text" id="chosen"></div>
    <div class="quantity"><span>数量</span><button id="less" aria-label="减少购买数量">−</button><output id="quantity">1</output><button id="more" aria-label="增加购买数量">＋</button></div>
    <div class="total">共需 <strong id="total">2</strong> 灵石</div><button class="buy" id="buy">购买</button>
  </div>
  <div class="bottom-note">成员寄存货物，由坊市照看 · 以灵石交易</div>
  <div class="hover-card" id="hover"></div>
  <div class="modal-shade" id="shade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="controls"><button class="paper-button" id="cancel">返回</button><button class="paper-button active" id="confirm">确认</button></div></div></div>
</div>
<script src="列式货单_示例数据_20261107.js"></script>
<script>
const $=id=>document.getElementById(id), stage=$('stage');
let source,offset=0,selected=null,quantity=1,scale=1;
const columns=[{left:104,width:350},{left:496,width:320},{left:860,width:328},{left:1231,width:337}];
function fit(){scale=Math.min(innerWidth/1672,innerHeight/941);stage.style.transform=`scale(${scale})`;stage.style.left=`${(innerWidth-1672*scale)/2}px`;stage.style.top=`${(innerHeight-941*scale)/2}px`;hideHover()}
function imagePath(item){return '../../../'+item.icon.replace('res://','')}
function showHover(item,event){const box=$('hover');box.innerHTML=`<img src="${imagePath(item)}" alt=""><h3>${item.name}</h3><p>${item.category}<br>占格 ${item.width} × ${item.height}<br>单价 ${item.price} 灵石</p>`;const rect=stage.getBoundingClientRect();const x=(event.clientX-rect.left)/scale,y=(event.clientY-rect.top)/scale;box.style.left=`${Math.min(x+18,1380)}px`;box.style.top=`${Math.min(y+12,660)}px`;box.style.display='block'}
function hideHover(){$('hover').style.display='none'}
function choose(stall,row){selected={stall,row};quantity=1;renderSelection();for(const button of document.querySelectorAll('.item-row'))button.classList.toggle('selected',button.dataset.stall===stall.id&&button.dataset.path===row.path)}
function renderSelection(){if(!selected)return;const {stall,row}=selected;$('chosenIcon').src=imagePath(row);$('chosen').innerHTML=`${stall.name} · ${row.name}<small>单价 ${row.price} 灵石 · 剩余 ${row.quantity} 件</small>`;$('quantity').textContent=quantity;$('total').textContent=row.price*quantity;$('less').disabled=quantity<=1;$('more').disabled=quantity>=row.quantity}
function render(){const term=$('search').value.trim();$('stalls').replaceChildren();source.stalls.slice(offset,offset+4).forEach((stall,index)=>{const column=document.createElement('section');column.className='stall';column.setAttribute('aria-label',stall.name);column.style.left=columns[index].left+'px';column.style.width=columns[index].width+'px';column.innerHTML=`<header class="stall-header"><h2>${stall.name}</h2><span class="custody">坊市代管</span><div class="owner">寄售人 · ${stall.owner}</div></header><div class="column-head"><span>货物</span><span>数量</span><span>灵石</span></div><div class="rows"></div><div class="stall-note"><span>${stall.rows.length} 种货物</span><span class="occupied">占用 <span>${stall.usedCells}</span> 格</span></div>`;const rows=column.querySelector('.rows');stall.rows.forEach(row=>{const button=document.createElement('button');button.className='item-row';button.dataset.stall=stall.id;button.dataset.path=row.path;button.setAttribute('aria-label',`${stall.name} ${row.name} ${row.quantity}件 单价${row.price}灵石`);button.innerHTML=`<span class="name">${row.name}</span><span class="count">${row.quantity}</span><span class="price">${row.price}</span>`;button.classList.toggle('selected',selected?.stall.id===stall.id&&selected?.row.path===row.path);button.classList.toggle('dim',term.length>0&&!row.name.includes(term));button.onclick=()=>choose(stall,row);button.onmouseenter=event=>showHover(row,event);button.onmousemove=event=>showHover(row,event);button.onmouseleave=hideHover;button.onblur=hideHover;rows.append(button)});$('stalls').append(column)});$('range').textContent=`第 ${offset+1}—${Math.min(source.stalls.length,offset+4)} 摊`;$('previous').disabled=offset===0;$('next').disabled=offset+4>=source.stalls.length}
function modal(title,text){hideHover();$('modalTitle').textContent=title;$('modalText').textContent=text;$('shade').style.display='flex'}
function closeModal(){$('shade').style.display='none'}
$('previous').onclick=()=>{offset=Math.max(0,offset-1);hideHover();render()};$('next').onclick=()=>{offset=Math.min(source.stalls.length-4,offset+1);hideHover();render()};
$('search').oninput=render;$('less').onclick=()=>{quantity=Math.max(1,quantity-1);renderSelection()};$('more').onclick=()=>{quantity=Math.min(selected.row.quantity,quantity+1);renderSelection()};
$('buy').onclick=()=>modal('确认购买',`${selected.stall.name} · ${selected.row.name} ×${quantity}\n共需 ${selected.row.price*quantity} 灵石，消耗 1 点精力。`);
$('mine').onclick=()=>modal('租用摊位','租金：1 灵石 / 游戏月，包含坊市代管。\n租期三十日，到期不自动续租。');
$('back').onclick=()=>modal('返回和光峰','结束本次逛坊。');$('browse').onclick=()=>{offset=0;$('search').value='';render()};$('cancel').onclick=closeModal;$('confirm').onclick=closeModal;
addEventListener('resize',fit);addEventListener('keydown',event=>{if(event.key==='Escape')closeModal()});
source=window.marketListsSample;choose(source.stalls[0],source.stalls[0].rows[0]);render();fit();window.previewReady=true;
</script>
</body>
</html>
