<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>玉虚仙宗 · 实装构图重绘对照</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eae7dd;color:#30392e;font-family:system-ui,"Microsoft YaHei",sans-serif}header,main,footer{max-width:1800px;margin:auto}
header{padding:28px 3vw 22px}h1{font-size:26px;font-weight:600;margin:0 0 10px}header p{color:#5b6556;line-height:1.8;margin:0}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:18px}.toolbar button,.viewerbar button{font:inherit;background:#f4f2e8;color:#30392e;border:1px solid #a7af9b;border-radius:4px;padding:8px 14px;cursor:pointer}.toolbar button[aria-pressed=true]{background:#d3dcc7;border-color:#748865}button:focus-visible{outline:3px solid #758b60;outline-offset:2px}#mode{font-size:14px;color:#5b6556}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;padding:0 3vw 30px}figure{margin:0;background:#f6f4eb;border:1px solid #c9c8b8;border-radius:5px;overflow:hidden}figure.overview{grid-column:1/-1}
figure>button{display:block;width:100%;padding:0;border:0;cursor:zoom-in;background:#dedfd3}figure img{display:block;width:100%;aspect-ratio:1672/941;object-fit:contain}figcaption{padding:12px 16px 15px}h2{font-size:18px;font-weight:600;margin:0 0 5px}figcaption p{font-size:14px;color:#606954;margin:0;line-height:1.6}
footer{padding:0 3vw 25px;font-size:13px;color:#606954}
dialog{padding:0;border:1px solid #8b9582;background:#eae7dd;color:#30392e;max-width:97vw;width:1700px;max-height:97vh}dialog::backdrop{background:rgba(22,28,23,.88)}.viewerbar{display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap}.viewerbar strong{margin-right:auto;font-size:16px}.viewerbar button{padding:6px 11px}#large{display:block;width:100%;max-height:84vh;object-fit:contain}
@media(max-width:760px){main{grid-template-columns:1fr;gap:18px}figure.overview{grid-column:auto}h1{font-size:22px}}
</style></head>
<body>
<header><h1>玉虚仙宗 · 实装构图重绘</h1><p>沿用认可的物品图标笔触，参照游戏现有场景恢复各峰不同的地形、取景和功能。总览补齐八峰对应地标并重新组织山域层次。<br>点击放大，左右方向键换图；可与替换前原图、上一批候选直接对照。</p><div class="toolbar"><button type="button" data-mode="after" aria-pressed="true">这次重绘</button><button type="button" data-mode="live" aria-pressed="false">替换前</button><button type="button" data-mode="previous" aria-pressed="false">上一批</button><span id="mode">当前：这次重绘</span></div></header>
<main><figure class="overview"><button type="button" data-index="0" aria-label="放大玉虚仙宗 · 山域总览"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/overview_eight_peaks_v2.png" alt="玉虚仙宗 · 山域总览" loading="eager"></button><figcaption><h2>玉虚仙宗 · 山域总览</h2><p>高峻山域、纵深主峰，边缘宫阙出画</p></figcaption></figure>
<figure><button type="button" data-index="1" aria-label="放大和光峰"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/heguang.png" alt="和光峰" loading="eager"></button><figcaption><h2>和光峰</h2><p>左侧庶务工作坪，右侧敞开山谷</p></figcaption></figure>
<figure><button type="button" data-index="2" aria-label="放大观复峰"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/guanfu.png" alt="观复峰" loading="eager"></button><figcaption><h2>观复峰</h2><p>临水住居、坡上阶路与授业亭</p></figcaption></figure>
<figure><button type="button" data-index="3" aria-label="放大紫府峰"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/zifu.png" alt="紫府峰" loading="lazy"></button><figcaption><h2>紫府峰</h2><p>高殿、长阶与层叠崖台</p></figcaption></figure>
<figure><button type="button" data-index="4" aria-label="放大玄览峰"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/xuanlan.png" alt="玄览峰" loading="lazy"></button><figcaption><h2>玄览峰</h2><p>贴崖藏经阁、多层研读廊</p></figcaption></figure>
<figure><button type="button" data-index="5" aria-label="放大天问峰"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/tianwen.png" alt="天问峰" loading="lazy"></button><figcaption><h2>天问峰</h2><p>露天演法台与沿山阶道</p></figcaption></figure>
<figure><button type="button" data-index="6" aria-label="放大天工峰"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/tiangong.png" alt="天工峰" loading="lazy"></button><figcaption><h2>天工峰</h2><p>错层丹房、锻器与制符工坊</p></figcaption></figure>
<figure><button type="button" data-index="7" aria-label="放大执中峰"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/zhizhong.png" alt="执中峰" loading="lazy"></button><figcaption><h2>执中峰</h2><p>前景钟亭，后方戒律殿</p></figcaption></figure>
<figure><button type="button" data-index="8" aria-label="放大瑶圃峰"><img src="../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/yaopu.png" alt="瑶圃峰" loading="lazy"></button><figcaption><h2>瑶圃峰</h2><p>药田、水渠、育苗棚与荷池</p></figcaption></figure></main>
<footer>2026-11-04 · 一张总览、八张峰内局部 · 原生图片，无预览调色 · 新总览与八峰内景已接入</footer>
<dialog id="viewer" aria-labelledby="viewerTitle"><div class="viewerbar"><strong id="viewerTitle"></strong><button type="button" id="compare">切到替换前</button><button type="button" id="prev">上一张</button><button type="button" id="next">下一张</button><button type="button" id="close">关闭</button></div><img id="large" alt=""></dialog>
<script>
const items=[{"id":"overview","name":"玉虚仙宗 · 山域总览","note":"高峻山域、纵深主峰，边缘宫阙出画","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/overview_eight_peaks_v2.png","live":"../../../textures/sect_overview/yuxu_xianzong_inner_overview_v6.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/overview.png"},{"id":"heguang","name":"和光峰","note":"左侧庶务工作坪，右侧敞开山谷","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/heguang.png","live":"../../../textures/sect_overview/peaks/yuxu_peak_heguang_v4.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/heguang.png"},{"id":"guanfu","name":"观复峰","note":"临水住居、坡上阶路与授业亭","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/guanfu.png","live":"../../../textures/sect_overview/peaks/yuxu_peak_guanfu_v4.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/guanfu.png"},{"id":"zifu","name":"紫府峰","note":"高殿、长阶与层叠崖台","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/zifu.png","live":"../../../textures/sect_overview/peaks/yuxu_peak_zifu_v4.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/zifu.png"},{"id":"xuanlan","name":"玄览峰","note":"贴崖藏经阁、多层研读廊","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/xuanlan.png","live":"../../../textures/sect_overview/peaks/yuxu_peak_xuanlan_v4.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/xuanlan.png"},{"id":"tianwen","name":"天问峰","note":"露天演法台与沿山阶道","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/tianwen.png","live":"../../../textures/sect_overview/peaks/yuxu_peak_tianwen_v4.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/tianwen.png"},{"id":"tiangong","name":"天工峰","note":"错层丹房、锻器与制符工坊","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/tiangong.png","live":"../../../textures/sect_overview/peaks/yuxu_peak_tiangong_v3.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/tiangong.png"},{"id":"zhizhong","name":"执中峰","note":"前景钟亭，后方戒律殿","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/zhizhong.png","live":"../../../textures/sect_overview/peaks/yuxu_peak_zhizhong_v4.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/zhizhong.png"},{"id":"yaopu","name":"瑶圃峰","note":"药田、水渠、育苗棚与荷池","after":"../../../textures/sect_overview/repaint_20261103/live_composition_item_style_20261104/yaopu.png","live":"../../../textures/sect_overview/peaks/yuxu_peak_yaopu_v3.png","previous":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/yaopu.png"}];
const labels={after:'这次重绘',live:'替换前',previous:'上一批'},modes=['after','live','previous'];
const viewer=document.getElementById('viewer'),large=document.getElementById('large'),title=document.getElementById('viewerTitle');let index=0,mode='after';
function refreshViewer(){large.src=items[index][mode];large.alt=items[index].name+' · '+labels[mode];title.textContent=large.alt;document.getElementById('compare').textContent='切到'+labels[modes[(modes.indexOf(mode)+1)%modes.length]]}
function show(n){index=(n+items.length)%items.length;refreshViewer();if(!viewer.open)viewer.showModal()}
function setMode(value){mode=value;document.querySelectorAll('[data-index]').forEach(b=>b.querySelector('img').src=items[Number(b.dataset.index)][mode]);document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===mode)));document.getElementById('mode').textContent='当前：'+labels[mode];if(viewer.open)refreshViewer()}
document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.index))));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.getElementById('compare').addEventListener('click',()=>setMode(modes[(modes.indexOf(mode)+1)%modes.length]));
document.getElementById('prev').addEventListener('click',()=>show(index-1));
document.getElementById('next').addEventListener('click',()=>show(index+1));
document.getElementById('close').addEventListener('click',()=>viewer.close());
document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}if(e.key==='ArrowRight'){e.preventDefault();show(index+1)}});
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
</script></body></html>
