*{box-sizing:border-box}body{margin:0;background:#ece7db;color:#34382f;font-family:system-ui,"Microsoft YaHei",sans-serif}

.toolbar{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}.toolbar button,.viewerbar button{padding:8px 14px;cursor:pointer;background:#f6f3e9;color:#30352b;border:1px solid #aeb19e;border-radius:3px;font:inherit}.toolbar button.active{background:#d5ddc8;border-color:#7c896d}#mode{color:#626558;font-size:14px}
main{max-width:1800px;margin:auto;padding:0 4vw 40px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}

figure button{border:0;background:none;padding:0;display:block;width:100%;cursor:zoom-in}figure img{display:block;width:100%;aspect-ratio:1672/941;object-fit:contain}
figcaption{padding:12px 15px 15px}h2{font-size:18px;margin:0 0 4px}figcaption span{font-size:13px;color:#676b5c}
dialog{padding:0;border:1px solid #878a7d;background:#ede9de;color:#30352b;max-width:96vw;width:1600px;max-height:96vh}dialog::backdrop{background:rgba(20,25,22,.86)}
.viewerbar{display:flex;align-items:center;gap:10px;padding:10px 15px;flex-wrap:wrap}.viewerbar strong{margin-right:auto}
#large{display:block;width:100%;height:auto;max-height:83vh;object-fit:contain}footer{padding:0 4vw 25px;color:#626558;font-size:13px}
@media(max-width:1000px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){main{grid-template-columns:1fr}}
</style>
<header><h1>玉虚仙宗 · 物品图标笔触版</h1><p>一张八峰总览，八张峰内局部。沿用已认可的和光峰试稿画法，以较大的颜料块面和柔和明暗取代密集白点。<br>点击图片放大；左右方向键切换，Esc关闭。可切换旧版比较。</p><div class="toolbar"><button type="button" id="after" class="active" aria-pressed="true">看重绘</button><button type="button" id="before" aria-pressed="false">看旧版</button><span id="mode">当前：重绘版</span></div></header>
<main><figure><button type="button" data-index="0" aria-label="放大玉虚仙宗 · 八峰总览"><img src="../../../textures/sect_overview/repaint_20261103/item_style_20261104/overview.png" alt="玉虚仙宗 · 八峰总览" loading="eager"></button><figcaption><h2>玉虚仙宗 · 八峰总览</h2><span>山域与主要通路</span></figcaption></figure>
<figure><button type="button" data-index="1" aria-label="放大和光峰"><img src="../../../textures/sect_overview/repaint_20261103/item_style_20261104/heguang.png" alt="和光峰" loading="eager"></button><figcaption><h2>和光峰</h2><span>庶务工作坪</span></figcaption></figure>
<figure><button type="button" data-index="2" aria-label="放大观复峰"><img src="../../../textures/sect_overview/repaint_20261103/item_style_20261104/guanfu.png" alt="观复峰" loading="eager"></button><figcaption><h2>观复峰</h2><span>授业院局部</span></figcaption></figure>
<figure><button type="button" data-index="3" aria-label="放大紫府峰"><img src="../../../textures/sect_overview/repaint_20261103/item_style_20261104/zifu.png" alt="紫府峰" loading="lazy"></button><figcaption><h2>紫府峰</h2><span>殿前庭院局部</span></figcaption></figure>
<figure><button type="button" data-index="4" aria-label="放大玄览峰"><img src="../../../textures/sect_overview/repaint_20261103/item_style_20261104/xuanlan.png" alt="玄览峰" loading="lazy"></button><figcaption><h2>玄览峰</h2><span>藏经阁与研读廊</span></figcaption></figure>

<figure><button type="button" data-index="6" aria-label="放大天工峰"><img src="../../../textures/sect_overview/repaint_20261103/item_style_20261104/tiangong.png" alt="天工峰" loading="lazy"></button><figcaption><h2>天工峰</h2><span>炼制院局部</span></figcaption></figure>
<figure><button type="button" data-index="7" aria-label="放大执中峰"><img src="../../../textures/sect_overview/repaint_20261103/item_style_20261104/zhizhong.png" alt="执中峰" loading="lazy"></button><figcaption><h2>执中峰</h2><span>戒律殿前院</span></figcaption></figure>
<figure><button type="button" data-index="8" aria-label="放大瑶圃峰"><img src="../../../textures/sect_overview/repaint_20261103/item_style_20261104/yaopu.png" alt="瑶圃峰" loading="lazy"></button><figcaption><h2>瑶圃峰</h2><span>药园局部</span></figcaption></figure></main>
<footer>2026-11-04 · 保留原生像素 · 无预览滤镜 · 尚未替换游戏原图</footer>
<dialog id="viewer" aria-labelledby="viewerTitle"><div class="viewerbar"><strong id="viewerTitle"></strong><button type="button" id="compare">看旧版</button><button type="button" id="prev">上一张</button><button type="button" id="next">下一张</button><button type="button" id="close">关闭</button></div><img id="large" alt=""></dialog>
<script>
const items=[{"id":"overview","name":"玉虚仙宗 · 八峰总览","note":"山域与主要通路","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/overview.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/overview.png"},{"id":"heguang","name":"和光峰","note":"庶务工作坪","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/heguang.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/heguang.png"},{"id":"guanfu","name":"观复峰","note":"授业院局部","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/guanfu.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/guanfu.png"},{"id":"zifu","name":"紫府峰","note":"殿前庭院局部","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/zifu.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/zifu.png"},{"id":"xuanlan","name":"玄览峰","note":"藏经阁与研读廊","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/xuanlan.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/xuanlan.png"},{"id":"tianwen","name":"天问峰","note":"演法台局部","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/tianwen.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/tianwen.png"},{"id":"tiangong","name":"天工峰","note":"炼制院局部","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/tiangong.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/tiangong.png"},{"id":"zhizhong","name":"执中峰","note":"戒律殿前院","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/zhizhong.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/zhizhong.png"},{"id":"yaopu","name":"瑶圃峰","note":"药园局部","after":"../../../textures/sect_overview/repaint_20261103/item_style_20261104/yaopu.png","before":"../../../textures/sect_overview/repaint_20261103/local_20261104/yaopu.png"}];
const viewer=document.getElementById('viewer'),large=document.getElementById('large'),title=document.getElementById('viewerTitle');let index=0,mode='after';
function refreshViewer(){large.src=items[index][mode];large.alt=items[index].name;title.textContent=items[index].name+(mode==='after'?' · 重绘':' · 旧版');document.getElementById('compare').textContent=mode==='after'?'看旧版':'看重绘'}
function show(n){index=(n+items.length)%items.length;refreshViewer();if(!viewer.open)viewer.showModal()}
function setMode(value){mode=value;document.querySelectorAll('[data-index]').forEach(b=>b.querySelector('img').src=items[Number(b.dataset.index)][mode]);for(const v of ['after','before']){const b=document.getElementById(v);b.classList.toggle('active',mode===v);b.setAttribute('aria-pressed',String(mode===v))}document.getElementById('mode').textContent=mode==='after'?'当前：重绘版':'当前：旧版对照';if(viewer.open)refreshViewer()}
document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.index))));
document.getElementById('after').addEventListener('click',()=>setMode('after'));document.getElementById('before').addEventListener('click',()=>setMode('before'));
document.getElementById('compare').addEventListener('click',()=>setMode(mode==='after'?'before':'after'));
document.getElementById('prev').addEventListener('click',()=>show(index-1));document.getElementById('next').addEventListener('click',()=>show(index+1));document.getElementById('close').addEventListener('click',()=>viewer.close());
document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}if(e.key==='ArrowRight'){e.preventDefault();show(index+1)}});
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
</script></html>
