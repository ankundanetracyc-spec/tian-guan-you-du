<script>
const items=[{"name":"玉虚仙宗 · 八峰总览","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/overview.png"},{"name":"和光峰 · 庶务工作坪","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/heguang.png"},{"name":"观复峰 · 授业院","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/guanfu.png"},{"name":"紫府峰 · 殿前","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/zifu.png"},{"name":"玄览峰 · 藏经阁","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/xuanlan.png"},{"name":"天问峰 · 演法台","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/tianwen.png"},{"name":"天工峰 · 炼制院","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/tiangong.png"},{"name":"执中峰 · 戒律殿前","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/zhizhong.png"},{"name":"瑶圃峰 · 药园","src":"../../../textures/sect_overview/repaint_20261103/local_20261104/yaopu.png"}];
const viewer=document.getElementById('viewer'),large=document.getElementById('large'),title=document.getElementById('viewerTitle');let index=0;
function show(n){index=(n+items.length)%items.length;large.src=items[index].src;large.alt=items[index].name;title.textContent=items[index].name;if(!viewer.open)viewer.showModal()}
document.querySelectorAll('[data-index]').forEach(b=>b.addEventListener('click',()=>show(Number(b.dataset.index))));
document.getElementById('prev').addEventListener('click',()=>show(index-1));document.getElementById('next').addEventListener('click',()=>show(index+1));document.getElementById('close').addEventListener('click',()=>viewer.close());
document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft'){e.preventDefault();show(index-1)}if(e.key==='ArrowRight'){e.preventDefault();show(index+1)}});
viewer.addEventListener('click',e=>{if(e.target===viewer)viewer.close()});
</script></html>
