<style>*{box-sizing:border-box}body{margin:0;background:#e9e7de;color:#30392e;font-family:system-ui,"Microsoft YaHei",sans-serif}header,main,footer{max-width:2000px;margin:auto}header{padding:28px 3vw 22px}h1{font-size:28px;font-weight:600;margin:0 0 10px}p{margin:0;color:#5b6559;line-height:1.8}a{color:#485f4b}.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}button{font:inherit;cursor:pointer;color:inherit}.filters button,.viewerbar button{background:#f6f4ec;border:1px solid #a8ad9f;border-radius:4px;padding:8px 15px}.filters button[aria-pressed=true]{background:#d2dccb;border-color:#778a70}button:focus-visible,a:focus-visible{outline:3px solid #778d70;outline-offset:3px}#count{margin-left:8px;color:#64705e;font-size:14px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:0 3vw 32px}figure{margin:0;overflow:hidden;background:#f6f4ec;border:1px solid #c7c8ba;border-radius:5px}figure[hidden]{display:none}figure>button{display:block;width:100%;padding:0;border:0;background:#dcded3;cursor:zoom-in}figure img{display:block;width:100%;aspect-ratio:16/9;object-fit:contain}figcaption{padding:13px 16px 17px}h2{font-size:19px;font-weight:600;margin:0 0 4px}figcaption p{font-size:14px}footer{padding:0 3vw 30px;font-size:14px;line-height:1.8;color:#606b5a}dialog{padding:0;border:1px solid #889682;background:#e9e7de;color:#30392e;max-width:97vw;width:1750px;max-height:97vh}dialog::backdrop{background:rgba(23,29,24,.9)}.viewerbar{display:flex;align-items:center;gap:9px;padding:10px 14px;flex-wrap:wrap}.viewerbar strong{font-size:18px;margin-right:auto}.viewerbar button{padding:6px 12px}#large{display:block;width:100%;max-height:83vh;object-fit:contain;background:#dcded3}#caption{padding:9px 16px 13px;font-size:14px}@media(max-width:1450px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){main{grid-template-columns:1fr;gap:18px}h1{font-size:24px}}</style></head>
<body><header><h1>白石城 · 基础内容首版</h1><p>街区与各处内景已接通，人物问答、告示、书目、既有NPC交易及序章研习已接入。<br>以下均为完整游戏窗口截图。点击放大，左右方向键切换。</p><div class="filters" role="group" aria-label="截图分类"><button type="button" data-filter="全部" aria-pressed="true">全部</button><button type="button" data-filter="人物与行动" aria-pressed="false">人物与行动</button><button type="button" data-filter="场景" aria-pressed="false">场景</button><button type="button" data-filter="小窗口" aria-pressed="false">小窗口</button><span id="count"></span></div></header>

<script>
const entries=[{"id":"npc_menu","title":"人物列表与问路菜单","kind":"人物与行动","description":"从实际在场角色的列表打开，沿用交谈与交易，并加入当前位置的问答。","src":"npc_menu.png"},{"id":"npc_dialogue","title":"客栈问路对白","kind":"人物与行动","description":"复用原有纸底墨字对白，人物来自实际世界名单。","src":"npc_dialogue.png"},{"id":"npc_trade","title":"NPC交易","kind":"人物与行动","description":"打开原有双方交换清单，读取该NPC的实际库存。","src":"npc_trade.png"},{"id":"notice_reading","title":"阅读讲法告示","kind":"人物与行动","description":"告示显示本期主持与去处。","src":"notice_reading.png"},{"id":"book_catalog","title":"查阅书目","kind":"人物与行动","description":"动态读取已开放功法，仅供查阅。","src":"book_catalog.png"},{"id":"city_overview","title":"白石城总览","kind":"场景","description":"四片街区均可进入，各自加载独立内景。","src":"city_overview.png"},{"id":"street_south","title":"南街","kind":"场景","description":"客栈所在的主街。","src":"street_south.png"},{"id":"inn","title":"客栈大堂","kind":"场景","description":"在场人物、城中问路与原NPC交互。","src":"inn.png"},{"id":"street_east","title":"东市","kind":"场景","description":"连接坊市与书坊。","src":"street_east.png"},{"id":"market","title":"坊市","kind":"场景","description":"交易廊内的人物沿用现有世界与库存。","src":"market.png"},{"id":"bookshop","title":"书坊","kind":"场景","description":"查阅书目与初学问答。","src":"bookshop.png"},{"id":"street_fuqian","title":"府前街","kind":"场景","description":"连接告示所与城守府。","src":"street_fuqian.png"},{"id":"notice_hall","title":"告示所","kind":"场景","description":"讲法告示、城中去处、问道须知。","src":"notice_hall.png"},{"id":"city_office","title":"城守府前厅","kind":"场景","description":"轮值问询，侧院通往讲法与研习。","src":"city_office.png"},{"id":"lecture","title":"讲法前院","kind":"场景","description":"原主持、来使、方远及既有序章交互。","src":"lecture.png"},{"id":"lecture_study","title":"研习处","kind":"场景","description":"实际读书侧屋；研习与暂歇按本期条件开放。","src":"lecture_study.png"},{"id":"street_west","title":"西城旧巷","kind":"场景","description":"独立巷景与在场人物问路。","src":"street_west.png"},{"id":"notice_1280","title":"1280×720窗口","kind":"小窗口","description":"纸签、角色列表、任务栏和底部导航共同显示。","src":"notice_1280.png"}];
const viewer=document.querySelector('#viewer'),large=document.querySelector('#large'),title=document.querySelector('#viewerTitle'),caption=document.querySelector('#caption'),count=document.querySelector('#count');let visible=entries.map((_,i)=>i),current=0;
function show(index){current=index;const e=entries[index];large.src=e.src;large.alt=e.title;title.textContent=e.title;caption.textContent=e.description+'　·　'+(visible.indexOf(index)+1)+' / '+visible.length;}
function step(delta){show(visible[(visible.indexOf(current)+delta+visible.length)%visible.length]);}
for(const b of document.querySelectorAll('[data-index]'))b.addEventListener('click',()=>{show(Number(b.dataset.index));viewer.showModal();});
for(const b of document.querySelectorAll('[data-filter]'))b.addEventListener('click',()=>{visible=[];document.querySelectorAll('main figure').forEach((f,i)=>{const match=b.dataset.filter==='全部'||f.dataset.kind===b.dataset.filter;f.hidden=!match;if(match)visible.push(i);});for(const other of document.querySelectorAll('[data-filter]'))other.setAttribute('aria-pressed',String(other===b));count.textContent=visible.length+' 张';});
document.querySelector('#previous').addEventListener('click',()=>step(-1));document.querySelector('#next').addEventListener('click',()=>step(1));document.querySelector('#close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',e=>{if(e.target===viewer){const r=viewer.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)viewer.close();}});document.addEventListener('keydown',e=>{if(!viewer.open)return;if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}if(e.key==='ArrowRight'){e.preventDefault();step(1);}});count.textContent=entries.length+' 张';
</script></body></html>
