<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>白石城 · 内景全套</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e7de;color:#30392e;font-family:system-ui,"Microsoft YaHei",sans-serif}header,main,footer{max-width:2000px;margin:auto}header{padding:28px 3vw 22px}h1{font-size:28px;font-weight:600;margin:0 0 10px}p{margin:0;color:#5b6559;line-height:1.8}a{color:#485f4b}.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}button{font:inherit;cursor:pointer;color:inherit}.filters button,.viewerbar button{background:#f6f4ec;border:1px solid #a8ad9f;border-radius:4px;padding:8px 15px}.filters button[aria-pressed=true]{background:#d2dccb;border-color:#778a70}button:focus-visible,a:focus-visible{outline:3px solid #778d70;outline-offset:3px}#count{margin-left:8px;color:#64705e;font-size:14px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;padding:0 3vw 32px}figure{margin:0;overflow:hidden;background:#f6f4ec;border:1px solid #c7c8ba;border-radius:5px}figure[hidden]{display:none}figure>button{display:block;width:100%;padding:0;border:0;background:#dcded3;cursor:zoom-in}figure img{display:block;width:100%;aspect-ratio:1672/941;object-fit:contain}figcaption{padding:13px 16px 17px}h2{font-size:19px;font-weight:600;margin:0 0 4px}figcaption p{font-size:14px}footer{padding:0 3vw 30px;font-size:14px;line-height:1.8;color:#606b5a}dialog{padding:0;border:1px solid #889682;background:#e9e7de;color:#30392e;max-width:97vw;width:1750px;max-height:97vh}dialog::backdrop{background:rgba(23,29,24,.9)}.viewerbar{display:flex;align-items:center;gap:9px;padding:10px 14px;flex-wrap:wrap}.viewerbar strong{font-size:18px;margin-right:auto}.viewerbar button{padding:6px 12px}#large{display:block;width:100%;max-height:83vh;object-fit:contain;background:#dcded3}#caption{padding:9px 16px 13px;font-size:14px}@media(max-width:1450px){main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:760px){main{grid-template-columns:1fr;gap:18px}h1{font-size:24px}}
</style></head>
<body>
<header><h1>白石城 · 内景全套</h1><p>四片街区、六处新场所，加上已有讲法前院，共十一张内景背景。<br>沿用白石城的灰砖木构，统一灰蓝、灰白与橄榄绿。点击放大，左右方向键切换。</p>
<div class="filters" role="group" aria-label="场景分类"><button type="button" data-filter="全部" aria-pressed="true">全部</button><button type="button" data-filter="街区" aria-pressed="false">街区</button><button type="button" data-filter="场所" aria-pressed="false">场所</button><span id="count">十一张</span><a href="../../../../textures/baishi/baishi_city_inner_overview_v7_urban_style.png">对照白石城总览</a></div></header>
<main><figure data-kind="街区"><button type="button" data-index="0" aria-label="放大南街"><img src="../../../../textures/baishi/interiors_20261105/street_south.png" alt="南街" loading="eager"></button><figcaption><h2>南街</h2><p>客栈前的弯曲主街与连续临街楼廊。</p></figcaption></figure>
<figure data-kind="街区"><button type="button" data-index="1" aria-label="放大东市"><img src="../../../../textures/baishi/interiors_20261105/street_east.png" alt="东市" loading="eager"></button><figcaption><h2>东市</h2><p>多层商楼围合的街市转角与开阔铺街。</p></figcaption></figure>
<figure data-kind="街区"><button type="button" data-index="2" aria-label="放大府前街"><img src="../../../../textures/baishi/interiors_20261105/street_fuqian.png" alt="府前街" loading="eager"></button><figcaption><h2>府前街</h2><p>通往城守府官署的石阶、街面和侧巷。</p></figcaption></figure>
<figure data-kind="街区"><button type="button" data-index="3" aria-label="放大西城旧巷"><img src="../../../../textures/baishi/interiors_20261105/street_west.png" alt="西城旧巷" loading="lazy"></button><figcaption><h2>西城旧巷</h2><p>高墙砖宅间的曲巷、院门与老树。</p></figcaption></figure>
<figure data-kind="场所"><button type="button" data-index="4" aria-label="放大客栈"><img src="../../../../textures/baishi/interiors_20261105/inn_lobby.png" alt="客栈" loading="lazy"></button><figcaption><h2>客栈</h2><p>带楼上回廊的客栈大堂。</p></figcaption></figure>
<figure data-kind="场所"><button type="button" data-index="5" aria-label="放大坊市"><img src="../../../../textures/baishi/interiors_20261105/market_arcade.png" alt="坊市" loading="lazy"></button><figcaption><h2>坊市</h2><p>有盖交易廊与可通行的柜铺。</p></figcaption></figure>
<figure data-kind="场所"><button type="button" data-index="6" aria-label="放大书坊"><img src="../../../../textures/baishi/interiors_20261105/bookshop.png" alt="书坊" loading="lazy"></button><figcaption><h2>书坊</h2><p>书架、阅书长案与二层藏书夹廊。</p></figcaption></figure>
<figure data-kind="场所"><button type="button" data-index="7" aria-label="放大告示所"><img src="../../../../textures/baishi/interiors_20261105/notice_hall.png" alt="告示所" loading="lazy"></button><figcaption><h2>告示所</h2><p>半开放告示廊与城务办事柜台。</p></figcaption></figure>
<figure data-kind="场所"><button type="button" data-index="8" aria-label="放大城守府前厅"><img src="../../../../textures/baishi/interiors_20261105/city_office.png" alt="城守府前厅" loading="lazy"></button><figcaption><h2>城守府前厅</h2><p>轮值驻守所在官署的公务前厅。</p></figcaption></figure>
<figure data-kind="场所"><button type="button" data-index="9" aria-label="放大研习处"><img src="../../../../textures/baishi/interiors_20261105/study_room.png" alt="研习处" loading="lazy"></button><figcaption><h2>研习处</h2><p>讲法前院后侧的公共读书与吐纳侧屋。</p></figcaption></figure>
<figure data-kind="场所"><button type="button" data-index="10" aria-label="放大讲法前院"><img src="../../../../textures/baishi/lecture_courtyard_v2_urban_style.png" alt="讲法前院" loading="lazy"></button><figcaption><h2>讲法前院</h2><p>已有新稿：讲案、验灵石与听讲坐席。</p></figcaption></figure></main>
<footer>1672×941 背景素材预览。<a href="README.md">范围与制作记录</a> · <a href="制作记录.json">内置生图提示词与来源</a></footer>
<dialog id="viewer" aria-labelledby="viewerTitle"><div class="viewerbar"><strong id="viewerTitle"></strong><button type="button" id="previous" aria-label="上一张">上一张</button><button type="button" id="next" aria-label="下一张">下一张</button><button type="button" id="close">关闭</button></div><img id="large" alt=""><p id="caption"></p></dialog>
<script>
const entries=[{"id":"street_south","title":"南街","kind":"街区","description":"客栈前的弯曲主街与连续临街楼廊。","src":"../../../../textures/baishi/interiors_20261105/street_south.png"},{"id":"street_east","title":"东市","kind":"街区","description":"多层商楼围合的街市转角与开阔铺街。","src":"../../../../textures/baishi/interiors_20261105/street_east.png"},{"id":"street_fuqian","title":"府前街","kind":"街区","description":"通往城守府官署的石阶、街面和侧巷。","src":"../../../../textures/baishi/interiors_20261105/street_fuqian.png"},{"id":"street_west","title":"西城旧巷","kind":"街区","description":"高墙砖宅间的曲巷、院门与老树。","src":"../../../../textures/baishi/interiors_20261105/street_west.png"},{"id":"inn_lobby","title":"客栈","kind":"场所","description":"带楼上回廊的客栈大堂。","src":"../../../../textures/baishi/interiors_20261105/inn_lobby.png"},{"id":"market_arcade","title":"坊市","kind":"场所","description":"有盖交易廊与可通行的柜铺。","src":"../../../../textures/baishi/interiors_20261105/market_arcade.png"},{"id":"bookshop","title":"书坊","kind":"场所","description":"书架、阅书长案与二层藏书夹廊。","src":"../../../../textures/baishi/interiors_20261105/bookshop.png"},{"id":"notice_hall","title":"告示所","kind":"场所","description":"半开放告示廊与城务办事柜台。","src":"../../../../textures/baishi/interiors_20261105/notice_hall.png"},{"id":"city_office","title":"城守府前厅","kind":"场所","description":"轮值驻守所在官署的公务前厅。","src":"../../../../textures/baishi/interiors_20261105/city_office.png"},{"id":"study_room","title":"研习处","kind":"场所","description":"讲法前院后侧的公共读书与吐纳侧屋。","src":"../../../../textures/baishi/interiors_20261105/study_room.png"},{"id":"lecture_courtyard","title":"讲法前院","kind":"场所","description":"已有新稿：讲案、验灵石与听讲坐席。","src":"../../../../textures/baishi/lecture_courtyard_v2_urban_style.png"}];
const viewer=document.querySelector('#viewer'), large=document.querySelector('#large'), title=document.querySelector('#viewerTitle'), caption=document.querySelector('#caption'), count=document.querySelector('#count');
let visible=entries.map((_,i)=>i), current=0;
function show(index){current=index;const entry=entries[index];large.src=entry.src;large.alt=entry.title;title.textContent=entry.title;caption.textContent=entry.description+'　·　'+(visible.indexOf(index)+1)+' / '+visible.length;}
function step(delta){const at=visible.indexOf(current);show(visible[(at+delta+visible.length)%visible.length]);}
for(const button of document.querySelectorAll('[data-index]'))button.addEventListener('click',()=>{show(Number(button.dataset.index));viewer.showModal();});
for(const button of document.querySelectorAll('[data-filter]'))button.addEventListener('click',()=>{const kind=button.dataset.filter;visible=[];document.querySelectorAll('main figure').forEach((figure,i)=>{const match=kind==='全部'||figure.dataset.kind===kind;figure.hidden=!match;if(match)visible.push(i);});for(const other of document.querySelectorAll('[data-filter]'))other.setAttribute('aria-pressed',String(other===button));count.textContent=visible.length+' 张';});
document.querySelector('#previous').addEventListener('click',()=>step(-1));document.querySelector('#next').addEventListener('click',()=>step(1));document.querySelector('#close').addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',event=>{if(event.target===viewer){const rect=viewer.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)viewer.close();}});
document.addEventListener('keydown',event=>{if(!viewer.open)return;if(event.key==='ArrowLeft'){event.preventDefault();step(-1);}if(event.key==='ArrowRight'){event.preventDefault();step(1);}});
count.textContent=entries.length+' 张';
</script></body></html>
