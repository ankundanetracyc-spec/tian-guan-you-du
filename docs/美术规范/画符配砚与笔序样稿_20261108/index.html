<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画符 · 配砚与笔序</title><link rel="icon" href="data:,"><link rel="stylesheet" href="preview.css"></head>
<body>
  <header class="preview-tools"><strong>已撤下 · 笔序旧稿</strong><span><a href="../画符纸墨配伍样稿_20261108/index.html">查看当前纸墨配伍样稿</a></span><nav aria-label="样稿状态"><button data-preview="prepare">准备</button><button data-preview="drawing">演出</button><button data-preview="result">鉴看</button></nav><a href="README.md">说明</a></header>
  <div id="viewport"><main id="stage" aria-label="画符工作台">
    <img class="room" src="../../../textures/ui/talisman_crafting_20261108/desk_v1.png" alt="水墨山亭中的画符案面">
    <canvas id="scene-canvas" width="1672" height="941" aria-label="符纸上的笔段与补墨点"></canvas>
    <div id="stone" class="stone asset-prop" aria-hidden="true"></div><div id="brush" class="brush asset-prop" aria-hidden="true"></div>
    <div id="stone-label" class="stone-label skin" data-skin="plain"><span id="stone-label-text">第一砚</span></div>
    <div id="prepare-layer">
      <header class="game-header skin" data-skin="wide"><button class="back btn" data-action="back">〈 返回</button><h1>画 符</h1><button class="btn recipe-current" data-action="recipes">符谱：炎矢符</button><button class="btn" data-action="notebook">配伍册</button><span class="proficiency">符箓造诣　—</span><button class="btn" data-action="help">画符说明</button></header>
      <section class="inputs skin" data-skin="tall" aria-label="配砚与选纸"><h2 id="input-heading">配墨</h2><p class="subheading" id="input-subheading">一砚可写全符，按笔段安排用墨</p><nav id="role-tabs" aria-label="准备对象"></nav>
        <div id="ink-controls"><div class="ink-choice-row"><label for="ink-select">墨砚</label><span class="field-skin"><select id="ink-select" aria-label="当前墨砚"></select><span class="down"></span></span><button class="btn" data-action="new-ink">另开一砚</button></div><div class="ink-actions"><button class="btn" data-action="ink-info">墨性与功用　›</button><button class="btn" data-action="delete-ink">收起此砚</button></div></div>
        <div id="input-list" class="scroll-area"></div><footer class="input-footer"><button class="btn" data-action="clear">清空本页</button><button class="btn" data-action="add">＋ 添加材料</button></footer>
      </section>
      <section class="work-heading skin" data-skin="wide"><div><span id="work-stage">准 备</span><strong id="work-name">炎矢符</strong></div><span id="work-description">远程单体伤害</span></section>
      <div class="work-tools"><button class="btn" data-action="brushes" id="brush-button">符笔：硬毫符笔　›</button><button class="btn" data-action="pattern">笔序安排　›</button></div>
      <button class="paper-hit" data-action="pattern" aria-label="在符纸上安排笔序"></button>
      <section class="work-bottom skin" data-skin="wide"><div class="input-utilities-head"><h3>笔序</h3><span>选一笔，安排蘸墨与接续</span></div><div id="stroke-list"></div><p id="pattern-summary"></p></section>
      <aside class="costs skin" data-skin="tall" aria-label="本次用度"><h2>本次用度</h2><dl class="resource-lines"><div><dt>可支配灵识</dt><dd>— / —</dd></div><div><dt>本次工艺需求</dt><dd>—</dd></div></dl><div class="meter" aria-label="灵识需求尚未标定"><span></span></div><h3>整批选材</h3><div id="cost-list" class="scroll-area"></div><dl class="cost-totals"><div><dt>物料</dt><dd><span id="material-kinds">—</span> / <span id="material-total">—</span></dd></div><div><dt>配制墨砚</dt><dd id="pool-total">—</dd></div><div><dt>符纸投入</dt><dd id="paper-total">—</dd></div><div><dt>工时</dt><dd>—</dd></div><div><dt>精力</dt><dd>—</dd></div></dl><p class="cost-condition">符效与成符张数，画成后鉴看。</p><button class="btn primary" id="start-button" data-action="start">开 始 画 符</button></aside>
    </div>
    <div class="scene-actions skin" data-skin="wide" id="scene-actions" hidden><span id="drawing-stage">研墨 · 调墨</span><button class="btn" data-action="skip">跳过演出</button></div>
    <section id="result-layer" hidden aria-label="成符鉴看"><div class="result-panel skin" data-skin="tall"><h2>成符鉴看</h2><div class="result-layout"><canvas id="result-canvas" width="280" height="420" aria-label="符箓鉴看外观示意"></canvas><div><h3 id="result-name">炎矢符</h3><p id="result-role">远程 · 单体敌人</p><dl><div><dt>符效</dt><dd>—</dd></div><div><dt>效果</dt><dd id="result-effect">数值待定</dd></div></dl><p class="result-note">仅演示笔序与鉴看，未计算真实成符。</p></div></div><button class="btn primary" data-action="finish">完 成 鉴 看</button></div></section>
    <div id="overlay-layer" hidden></div><div id="toast" class="skin" data-skin="jade" role="status" hidden></div>
  </main></div>
  <script src="catalog.js"></script><script src="preview.js"></script>
</body></html>
