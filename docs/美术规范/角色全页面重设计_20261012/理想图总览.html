<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>角色界面 · 理想图审阅</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#20241f;color:#f2ecd9;font-family:"Microsoft YaHei",sans-serif}header{display:flex;align-items:center;gap:18px;padding:16px 24px;border-bottom:1px solid #535746;flex-wrap:wrap}h1{margin:0;font-size:18px;font-weight:500}small{color:#c5c1ad}nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px}button,a{font:inherit}button{cursor:pointer;border:1px solid #69705d;background:transparent;color:#e3dfce;padding:9px 16px;border-radius:4px}button[aria-selected="true"]{background:#e9dfc5;color:#282d25;border-color:#e9dfc5}button:focus-visible,a:focus-visible{outline:2px solid #b3cfae;outline-offset:3px}main{padding:0 24px 24px}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid #62644f}footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 0;font-size:14px;line-height:1.6}a{color:#e9d6a6}p{margin:0} @media(max-width:700px){header,nav{padding-left:12px;padding-right:12px}main{padding:0 12px 12px}button{padding:7px 10px}footer{align-items:flex-start}}
</style>
<header><h1>角色界面 · 理想图 v5</h1><small>已授权实装；实际界面已按最新反馈移除正文重复标题横栏。图中数据为排版示例。</small></header>
<nav aria-label="设计页面" id="tabs"></nav>
<main><figure><img id="screen" alt="概览理想图"></figure><footer><p id="caption"></p><a id="original" target="_blank" rel="noopener">查看原图 ↗</a></footer></main>
<script>
const pages=[["概览","01_概览_理想图.png","完整人物、资料、心境与独立状态区。"],["属性 v2","02_属性_理想图_v2.png","移除灵核；造诣支持搜索、分类和内部滚动，以后可扩充。"],["战斗 v3","03_战斗_理想图_v3.png","技能库与十个装配位；复用悬停信息，浮层只读，不保留右侧详情列。"],["功法·秘籍库 v5","04_功法_秘籍库_理想图_v5.png","紧凑装配栏；浏览已学或持有的未装配秘籍；支持名称、关键词及习得内容检索，完整说明悬停查看。"],["装备 v3","05_装备_理想图_v3.png","穿戴与法宝两列；装备信息悬停显示，操作沿用原入口。"],["关系","06_关系_理想图.png","当前没有关系数据时的名录、详情与纪事空状态。"],["行囊·悬停","07_行囊_悬停_理想图.png","通宽网格；悬停显示浮动详情；数量放在名称后。"],["行囊·单击","08_行囊_单击_理想图.png","左键选中可用物品，浮层显示使用与取消。布甲使用调用穿戴。"],["功法·心法悬停 v5","10_功法_多辅修与心法悬停_理想图_v5.png","一主三辅扩展示例；未装配秘籍的心法悬停预览，不标为已生效；槽位按实际可用数量排列，不规定境界门槛或上限。"]];const nav=document.querySelector("#tabs");let selected=0;
pages.forEach((page,index)=>{const button=document.createElement("button");button.type="button";button.textContent=page[0];button.onclick=()=>show(index);nav.append(button);});
function show(index){selected=index;const p=pages[index];document.querySelector("#screen").src=p[1];document.querySelector("#screen").alt=p[0]+"理想图";document.querySelector("#caption").textContent=p[2];document.querySelector("#original").href=p[1];Array.from(nav.children).forEach((b,i)=>b.setAttribute("aria-selected",String(i===index)));location.hash=String(index+1);}
window.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight"){e.preventDefault();show((selected+1)%pages.length)}if(e.key==="ArrowLeft"){e.preventDefault();show((selected+pages.length-1)%pages.length)}});
const start=Number(location.hash.slice(1))-1;show(Number.isInteger(start)&&start>=0&&start<pages.length?start:0);
</script></html>
