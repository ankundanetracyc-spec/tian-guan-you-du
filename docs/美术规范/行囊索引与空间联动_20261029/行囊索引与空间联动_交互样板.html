<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">

<title>行囊 · 索引与空间联动</title>
<style>
@font-face{font-family:InkUI;src:url('../../../resources/font/LXGWZhenKaiSlabGB-Regular.ttf')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:#ded4bb;font-family:InkUI,'Microsoft YaHei',serif;color:#303d38}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #456f60;outline-offset:3px}button:disabled{cursor:default}.stage{width:1920px;height:1080px;position:absolute;transform-origin:top left;background:radial-gradient(ellipse at 75% 105%,#b8bca42b,transparent 45%),radial-gradient(ellipse at 12% -10%,#aaac9538,transparent 38%),#eee5ce}.stage:before{content:'';position:absolute;inset:0;pointer-events:none;border:18px solid #b1a58b55;outline:1px solid #b0a07e;outline-offset:-29px;background-image:url('../../../textures/ui/inventory_20261012/approved_shell_v1.png');background-size:1920px 1080px;opacity:.12}.topbar{position:absolute;left:42px;right:42px;top:24px;height:76px;display:flex;align-items:center;border-bottom:1px solid #a89e82;gap:24px}.topbar h1{font-size:40px;font-weight:400;letter-spacing:8px;margin:0}.topbar .sub{font-size:21px;color:#727965}.topbar .sample{margin-left:auto;font-size:17px;color:#827964}.panel{position:absolute;top:124px;bottom:52px;border:1px solid #b6a78a;background:#f3ecd9cf}.panel:before,.panel:after{content:'';position:absolute;width:12px;height:12px;border-color:#a59879;border-style:solid;pointer-events:none}.panel:before{left:4px;top:4px;border-width:1px 0 0 1px}.panel:after{right:4px;bottom:4px;border-width:0 1px 1px 0}.index-panel{left:42px;width:620px;padding:24px}.index-heading{display:flex;gap:16px;align-items:baseline;margin:0 0 18px}.index-heading h2{margin:0;font-weight:400;font-size:29px}.index-heading span{margin-left:auto;color:#7e7d69;font-size:18px}.search{height:49px;display:flex;align-items:center;border-bottom:1px solid #a49e83;background:#f8f2e3b8;padding:0 10px;gap:12px}.search span{font-size:22px;color:#768271}.search input{width:100%;border:0;outline:none;background:none;font-size:21px;padding:8px 0}.search input::placeholder{color:#8a8a76}.categories{display:flex;gap:7px;margin:18px 0 12px;border-bottom:1px solid #c9bea3;padding-bottom:12px}.category{border:0;background:transparent;font-size:21px;padding:6px 13px;color:#697463}.category.active{background:#a5b5a34d;color:#345c4b;border-bottom:2px solid #55745f}.index-columns{display:grid;grid-template-columns:minmax(0,1fr)52px 230px;gap:12px;color:#8b826e;font-size:17px;padding:0 27px 10px 11px}.index-columns span:nth-child(2){text-align:center}.index-columns span:last-child{text-align:left;padding-left:14px}.index-scroll{height:calc(100% - 228px);overflow:auto;padding-right:8px;scrollbar-width:thin;scrollbar-color:#a9ad96 transparent}.index-row{position:relative;display:grid;grid-template-columns:minmax(0,1fr)52px 230px;align-items:center;width:100%;height:55px;padding:9px 11px;border:0;border-bottom:1px solid #c7bea562;background:transparent;text-align:left;gap:12px}.index-row:hover,.index-row.is-linked{background:#ccd5bd40}.index-row.is-selected{background:#b6c8b653;box-shadow:inset 3px 0 #5a7d66}.row-art{width:52px;height:58px;object-fit:contain;flex-shrink:0}.row-text{flex:1;min-width:0}.row-name{display:block;font-size:23px;line-height:30px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row-location{display:block;font-size:17px;color:#7b806f;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-count{width:42px;text-align:center;font-size:22px;color:#526553}.empty-index{font-size:23px;color:#8e8c77;margin:60px 0;text-align:center}.index-hint{position:absolute;bottom:18px;left:24px;right:24px;font-size:18px;color:#7d806b;border-top:1px solid #c5baa0;padding-top:12px}.space-panel{left:686px;right:42px;padding:24px}.space-header{display:flex;align-items:center;min-height:40px;gap:13px}.crumb{font-size:28px;padding:0;border:0;background:none}.crumb:hover{text-decoration:underline;text-underline-offset:6px}.crumb-separator{color:#a29b82;font-size:23px}.space-header .state{margin-left:auto;font-size:19px;color:#6c806b}.location-status{height:36px;line-height:36px;font-size:19px;color:#49715a}.workspace-scroll{height:calc(100% - 130px);overflow:auto;scrollbar-width:thin;scrollbar-color:#a9ad96 transparent}.body-board{height:672px;width:1140px;position:relative;--cell:42px}.region{position:absolute}.region h3{font-size:25px;font-weight:400;letter-spacing:4px;margin:0 0 12px;height:30px;line-height:30px}.region.is-located h3{color:#3c6d50}.region-grid{position:relative;border:1px solid #939b7f;background-color:#dfdfc32b;background-image:linear-gradient(to right,#9aa58c73 1px,transparent 1px),linear-gradient(to bottom,#9aa58c73 1px,transparent 1px);background-size:42px 42px}.bag-item{position:absolute;display:block;padding:0;border:1px solid transparent;background:transparent;overflow:visible}.bag-item img{width:100%;height:100%;object-fit:contain;pointer-events:none;display:block}.bag-item:hover,.bag-item.is-linked{background:#b6c3a843;border-color:#88a58c}.bag-item.is-selected{border:2px solid #748f72;background:#bac7aa35}.bag-item.is-located{border:2px solid #3e6e52;outline:4px solid #7a9c746e;outline-offset:3px;background:#aabf9833}.bag-item.is-located:after{content:'已定位';position:absolute;left:0;bottom:-25px;white-space:nowrap;font-size:15px;color:#345b43;background:#e4e8d6;border:1px solid #8da081;padding:1px 5px;z-index:3}.bag-item.is-filtered{opacity:.22}.bag-item.is-located.is-filtered{opacity:1}.space-footer{position:absolute;left:24px;right:24px;bottom:16px;border-top:1px solid #c6bda4;padding-top:12px;display:flex;align-items:center;color:#7b826d;font-size:19px}.space-footer span:last-child{margin-left:auto}.external-board{height:672px;width:1140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}.external-mode{font-size:19px;color:#88816e}.external-target{border:1px solid #aab79b;background:#e9ead6;padding:24px 50px;display:flex;align-items:center;gap:30px;max-width:680px}.external-target.is-located{border:2px solid #4d7357;outline:4px solid #a6bc9880;outline-offset:4px}.external-target img{height:210px;width:140px;object-fit:contain}.external-target h3{font-size:29px;font-weight:400;margin:0 0 16px}.external-target p{font-size:20px;color:#6f7f69}.external-return{border:1px solid #b0aa8e;background:#f4eedc;padding:9px 22px;font-size:20px}.footnote{position:absolute;left:48px;bottom:18px;color:#8b8674;font-size:15px;letter-spacing:1px}.tooltip{display:none;position:fixed;z-index:10;width:400px;pointer-events:none;background:#242c27f7;border:1px solid #b8ad8b;color:#ece4cf;padding:19px;font-family:InkUI,'Microsoft YaHei',serif;box-shadow:0 2px 4px #252c2330}.tooltip.show{display:block}.tooltip-head{display:grid;grid-template-columns:92px 1fr 96px;align-items:start;gap:12px}.tooltip-icon{width:92px;height:104px;object-fit:contain}.tooltip-title{font-size:23px;line-height:30px;padding-top:3px;overflow-wrap:anywhere}.tooltip-sub{font-size:16px;color:#c9cbb9;margin-top:10px}.tooltip-footprint{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:16px;color:#c7c8ae}.mini-grid{display:grid;border-left:1px solid #adad8e;border-top:1px solid #adad8e}.mini-grid i{display:block;width:16px;height:16px;background:#a5b29377;border-right:1px solid #adad8e;border-bottom:1px solid #adad8e}.tooltip-description{margin-top:16px;padding-top:12px;border-top:1px solid #b9b18c55;font-size:19px;line-height:1.55;white-space:pre-wrap;color:#e7dfc7}.tooltip-description:empty{display:none}@media(prefers-reduced-motion:no-preference){.bag-item,.index-row{transition:background-color .12s,border-color .12s,opacity .12s}}
</style>
<link rel="stylesheet" href="行囊清册专用皮肤.css">
<main class="stage" id="stage">
 <header class="topbar"><h1>行囊</h1><span class="sub">随身物资</span><span class="sample">交互样板</span></header>
 <section class="panel index-panel" aria-label="物品索引">
  <div class="index-heading"><h2>物品清册</h2><span id="index-count"></span></div>
  <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索物品名称" aria-label="搜索物品名称"></label>
  <div class="category-rail"><button class="category-scroll-btn" id="category-prev" aria-label="上一组分类">‹</button><nav class="categories" id="categories" aria-label="物品分类"></nav><button class="category-scroll-btn" id="category-next" aria-label="下一组分类">›</button></div>
  <div class="index-columns"><span>物品</span><span>数量</span></div>
  <div class="index-scroll" id="index-list" aria-label="库存物品索引"></div>
  <div class="index-hint">双击同种物品，依次定位</div>
 </section>
 <section class="panel space-panel" aria-label="行囊空间">
  <header class="space-header" id="breadcrumbs"></header>
  <div class="location-status" id="location-status" aria-live="polite"></div>
  <div class="workspace-scroll" id="workspace-scroll"><div id="workspace"></div></div>
  <footer class="space-footer"><span id="space-container-note">悬停查看物品详情与占格</span><span id="space-count"></span></footer>
 </section>
 <div class="footnote">索引与空间展示同一份库存</div>
</main>
<aside class="tooltip" id="tooltip" role="tooltip" aria-hidden="true"></aside>
<script src="行囊索引交互.js"></script>
<script src="行囊空间拖拽.js"></script>
</html>
