<style>

<main>
<h1>玉虚仙宗 · 山腰落位</h1>
<p>后山托住主殿，院落落在山腰台地上，前坡与石阶把建筑接回山体。</p>
<div class="toolbar"><button id="normal" aria-pressed="true">地图尺寸</button><button id="large" aria-pressed="false">放大看接地</button><a class="button" href="玉虚山腰落位_整体样板_v1.png">查看原图</a></div>
<div class="row">
<section class="card"><h2>原建筑 · 宽164像素</h2><div class="old"><img src="../../../textures/world/bai_chuan/acceptance_v1/icons/sect_164.png" alt="现有玉虚宗门通用院落，宽164像素"></div><div class="caption">建筑单独展示，供大小与建筑风格对照。</div></section>
<section class="card" id="sample"><h2>山腰样板 · 建筑约164像素宽</h2><div class="stage"><div class="scene"><img id="sceneImage" src="玉虚山腰落位_整体样板_v1.png" alt="玉虚仙宗嵌在山腰台地上，后有山脊，前有山坡，石阶向山脚延伸"><button class="hotspot" aria-label="查看玉虚仙宗" title="玉虚仙宗"></button></div></div><div class="caption" id="scaleNote">整幅局部图按474像素宽显示，建筑主体约164像素宽；用于观察地图尺度下的接地感。</div></section>
</div>
<p class="detail" id="detail" role="status" aria-live="polite">可点选山腰建筑，查看这处地点的落位说明。</p>
<p class="muted note">这是一张完整绘制的局部美术样板，原图1254×1254。它展示山体与建筑的遮挡效果，尚未拆成后山、建筑、前坡独立贴图，也未接入游戏。建筑宽度依据画面边界估算，未作为正式尺寸定稿。</p>
</main>
<script>
const sample=document.querySelector('#sample'),normal=document.querySelector('#normal'),large=document.querySelector('#large'),note=document.querySelector('#scaleNote');
function setZoom(on){sample.classList.toggle('zoom',on);normal.setAttribute('aria-pressed',String(!on));large.setAttribute('aria-pressed',String(on));note.textContent=on?'放大两倍检查：主殿脚下的台地、墙脚遮挡、护坡及下山石阶。':'整幅局部图按474像素宽显示，建筑主体约164像素宽；用于观察地图尺度下的接地感。'}
normal.addEventListener('click',()=>setZoom(false));large.addEventListener('click',()=>setZoom(true));
document.querySelector('.hotspot').addEventListener('click',()=>{document.querySelector('#detail').textContent='玉虚仙宗｜原规划坐标22／74，地点ID bc_place_001。样板采用山腰台地：后山在主殿之后，前侧山石与坡面遮住部分台地边缘，石阶沿坡落到山脚。此处仅演示独立点击区域，不执行旅行。'});
</script>
