<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>大世界术法入口交互原型 v6</title>
  <style>
    @font-face {
      font-family: "ProjectZhenKai";
      src: url("../../resources/font/LXGWZhenKaiSlabGB-Regular.ttf") format("truetype");
      font-display: swap;
    }
    :root {
      --paper: #eee6d2;
      --ink: #29251f;
      --gold: #b79a5c;
      --jade: #718b68;
      --hud-bg: rgba(5, 9, 7, .96);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #272720; color: var(--ink); }
    body { padding: 18px; font-family: "ProjectZhenKai", "Microsoft YaHei", serif; }
    .wrap { width: min(100%, 1672px); margin: 0 auto; }
    .caption { margin: 0 0 10px 3px; color: #e8dfcb; font: 14px/1.5 "Microsoft YaHei", sans-serif; letter-spacing: .025em; }
    .screen {
      position: relative;
      width: 100%;
      aspect-ratio: 1672 / 941;
      overflow: hidden;
      isolation: isolate;
      border: 1px solid #514a3d;
      background: #e8dfca;
      box-shadow: 0 16px 42px #0007;
    }
    .map {
      position: absolute;
      inset: 0;
      background-image: url("../../textures/world_map/bai_chuan/natural_scenery_20261009_v2/installed_start_region_preview.png");
      background-repeat: no-repeat;
      background-size: auto 360%;
      background-position: center 52%;
      cursor: crosshair;
    }
    .map::after { content: ""; position: absolute; inset: 0; background: #eee5d314; pointer-events: none; }
    .map-selection {
      display: none;
      position: absolute;
      z-index: 2;
      width: 44px;
      height: 44px;
      border: 2px solid #aa533f;
      border-radius: 50%;
      box-shadow: 0 0 0 5px #a6534319, inset 0 0 0 1px #f4e8cb;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .map-selection.visible { display: block; }
    .destination-chip {
      display: none;
      position: absolute;
      z-index: 3;
      top: 22px;
      left: 22px;
      padding: 8px 13px;
      border: 1px solid #8b806a;
      border-radius: 5px;
      background: rgba(241, 234, 216, .93);
      color: #40392d;
      font-size: 14px;
      box-shadow: 0 2px 8px #30291e24;
      pointer-events: none;
    }
    .destination-chip.visible { display: block; }
    .player-status {
      position: absolute;
      left: 22px;
      bottom: 22px;
      width: 330px;
      min-height: 118px;
      padding: 15px 17px;
      color: #f2ead9;
      background: rgba(7, 11, 9, .93);
      border: 1px solid #a78d5a;
      border-radius: 9px;
      box-shadow: 0 4px 15px #201c1540;
      font: 14px/1.45 "Microsoft YaHei", sans-serif;
    }
    .player-status strong { color: #e6cf96; font: 19px/1.4 "ProjectZhenKai", serif; }
    .status-meters { display: grid; gap: 7px; margin-top: 8px; }
    .status-meter { display: grid; grid-template-columns: 88px 1fr; align-items: center; gap: 8px; color: #e6dfcf; font-size: 12px; }
    .status-bar { position: relative; flex: 1; height: 9px; overflow: hidden; border-radius: 4px; background: #29231f; }
    .status-bar::after { content: ""; position: absolute; inset: 0 22% 0 0; border-radius: 4px; background: #a64e40; }
    .status-bar.stamina::after { inset: 0 48% 0 0; background: #718b68; }
    .nav {
      position: absolute;
      z-index: 5;
      right: 132px;
      bottom: 18px;
      display: flex;
      align-items: flex-end;
      gap: 14px;
      height: 132px;
    }
    .nav-entry, .spell-entry { width: 104px; height: 132px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; }
    .nav-button, .spell-button {
      position: relative;
      display: grid;
      place-items: center;
      flex: 0 0 98px;
      width: 104px;
      height: 98px;
      padding: 0;
      overflow: hidden;
      border: 0;
      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      transition: background .12s, transform .12s;
    }
    .nav-button:hover, .spell-button:hover { background: #ffffff1f; }
    .nav-button:active, .spell-button:active { background: #00000026; transform: translateY(1px); }
    .nav-button img, .spell-button img { display: block; width: 104px; height: 98px; object-fit: contain; }
    .nav-label, .spell-label { height: 30px; color: #fffdf3; font: 21px/1.3 "ProjectZhenKai", "Microsoft YaHei", serif; text-shadow: 0 1px 3px #17130d, 0 0 4px #17130d; white-space: nowrap; }
    .spell-entry {
      position: absolute;
      z-index: 6;
      right: 132px;
      bottom: 150px;
      height: 121px;
    }
    .spell-button { flex-basis: 98px; }
    .spell-label { height: 21px; }
    .enabled-indicator {
      display: none;
      position: absolute;
      top: 5px;
      right: 3px;
      padding: 3px 7px;
      border: 1px solid #839078;
      border-radius: 10px;
      color: #e8eedf;
      background: #405143ed;
      font: 11px/1.1 "Microsoft YaHei", sans-serif;
      white-space: nowrap;
    }
    .enabled-indicator.visible { display: block; }
    .spell-panel {
      position: absolute;
      z-index: 7;
      right: 132px;
      bottom: 284px;
      width: min(410px, calc(100% - 28px));
      padding: 15px 16px 13px;
      border: 1px solid #94876e;
      border-radius: 7px;
      color: #383329;
      background: rgba(240, 233, 215, .97);
      box-shadow: 0 8px 24px #332b1f38;
      opacity: 0;
      pointer-events: none;
      transform: translateY(7px);
      transition: opacity .14s, transform .14s;
    }
    .spell-panel.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .panel-head { display: flex; align-items: flex-start; justify-content: space-between; padding-bottom: 10px; border-bottom: 1px solid #9a8d7459; }
    .panel-head h2 { margin: 0; color: #342e25; font: 22px/1.2 "ProjectZhenKai", serif; font-weight: 500; letter-spacing: .03em; }
    .panel-head p { margin: 5px 0 0; color: #777061; font: 12px/1.4 "Microsoft YaHei", sans-serif; }
    .close { width: 28px; height: 28px; padding: 0; border: 0; color: #635b4c; background: transparent; font: 25px/1 "Microsoft YaHei", sans-serif; cursor: pointer; }
    .close:hover { color: #a65343; }
    .spell-grid { display: grid; grid-template-columns: repeat(3, minmax(84px, 1fr)); gap: 9px; margin-top: 12px; }
    .spell-card {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: 95px;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 5px 4px 4px;
      border: 1px solid #a69a7f;
      border-radius: 5px;
      color: #3b342a;
      background: #e9dfc8;
      cursor: pointer;
      transition: background .12s, border-color .12s;
    }
    .spell-card:hover, .spell-card:focus-visible { border-color: #6e806d; background: #f1e8d3; outline: none; }
    .spell-card.active { border-color: #657b66; background: #e0e5d5; }
    .spell-card img { width: 62px; height: 62px; object-fit: cover; border-radius: 2px; }
    .spell-name { max-width: 100%; overflow: hidden; color: #352e24; font: 14px/1.35 "ProjectZhenKai", serif; text-overflow: ellipsis; white-space: nowrap; }
    .spell-card-state { display: none; color: #4f6853; font: 11px/1.3 "Microsoft YaHei", sans-serif; }
    .spell-card.active .spell-card-state { display: block; }
    .panel-hint { margin: 11px 0 0; color: #746b5a; font: 12px/1.55 "Microsoft YaHei", sans-serif; }
    .spell-tooltip {
      position: absolute;
      z-index: 10;
      width: min(350px, calc(100% - 24px));
      max-height: calc(100% - 24px);
      overflow: auto;
      padding: 11px 12px 12px;
      color: #f1ead7;
      background: var(--hud-bg);
      border: 1px solid var(--gold);
      border-radius: 6px;
      box-shadow: 0 8px 24px #15120c70;
      opacity: 0;
      pointer-events: none;
      transform: translateY(3px);
      transition: opacity .12s, transform .12s;
    }
    .spell-tooltip.visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .tooltip-head { display: flex; align-items: center; gap: 10px; padding-bottom: 9px; border-bottom: 1px solid #b79a5c70; }
    .tooltip-icon { flex: 0 0 58px; width: 58px; height: 58px; object-fit: cover; border-radius: 2px; }
    .tooltip-title { color: #f1dfad; font: 21px/1.25 "ProjectZhenKai", serif; }
    .tooltip-meta { margin-top: 4px; color: #c8bd9d; font: 13px/1.5 "Microsoft YaHei", sans-serif; }
    .tooltip-section { margin: 10px 0 4px; color: #e6c77e; font: 14px/1.3 "Microsoft YaHei", sans-serif; }
    .tooltip-body { color: #f1ead7; font: 14px/1.65 "Microsoft YaHei", sans-serif; }
    .tooltip-route { margin-top: 9px; padding-top: 8px; border-top: 1px solid #b79a5c70; color: #dfd3b3; font: 12px/1.6 "Microsoft YaHei", sans-serif; }
    .toast {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 36px;
      max-width: calc(100% - 40px);
      padding: 9px 15px;
      border: 1px solid #8d8062;
      border-radius: 5px;
      color: #443d31;
      background: #f1ead9;
      box-shadow: 0 3px 12px #2b261d3b;
      font: 13px/1.45 "Microsoft YaHei", sans-serif;
      opacity: 0;
      transform: translate(-50%, 10px);
      transition: .15s;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    @media (max-width: 1050px) {
      body { padding: 8px; }
      .screen { min-height: 650px; aspect-ratio: auto; }
      .nav { right: 12px; bottom: 12px; gap: 4px; transform: scale(.62); transform-origin: right bottom; }
      .spell-entry { right: 12px; bottom: 94px; transform: scale(.62); transform-origin: right bottom; }
      .spell-panel { right: 12px; bottom: 180px; width: min(410px, calc(100% - 24px)); }
      .spell-tooltip { width: min(350px, calc(100% - 24px)); }
      .player-status { left: 12px; bottom: 12px; width: 250px; }
      .spell-grid { grid-template-columns: repeat(3, minmax(66px, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="caption">大世界术法入口 · 交互原型 v6（“术法”入口与底栏同尺寸圆框；具体术法使用方形技能风格图标）</p>
    <section class="screen" aria-label="百川固定方格地图与术法入口概念">
      <div class="map" id="map" aria-label="点击地图格选择路线终点">
        <div class="map-selection" id="map-selection"></div>
        <div class="destination-chip" id="destination-chip">路线终点已选 · 点击地图可更换</div>
      </div>
      <aside class="player-status" aria-label="角色状态 HUD 样式参考">
        <strong>主角状态</strong><br>
        <div class="status-meters">
          <div class="status-meter"><span>生命</span><span class="status-bar"></span></div>
          <div class="status-meter"><span>大世界精力</span><span class="status-bar stamina"></span></div>
        </div>
      </aside>
      <nav class="nav" aria-label="主界面底部导航">
        <div class="nav-entry"><button class="nav-button" aria-label="世界"><img src="../../textures/ui/qingxi/bottom_nav_world_ink_v2.png" alt=""></button><span class="nav-label">世界</span></div>
        <div class="nav-entry"><button class="nav-button" aria-label="角色"><img src="../../textures/ui/qingxi/bottom_nav_character_ink_v1.png" alt=""></button><span class="nav-label">角色</span></div>
        <div class="nav-entry"><button class="nav-button" aria-label="行囊"><img src="../../textures/ui/qingxi/bottom_nav_inventory_ink_v2.png" alt=""></button><span class="nav-label">行囊</span></div>
        <div class="nav-entry"><button class="nav-button" aria-label="见闻"><img src="../../textures/ui/qingxi/bottom_nav_rumors_ink_v1.png" alt=""></button><span class="nav-label">见闻</span></div>
        <div class="nav-entry"><button class="nav-button" aria-label="信件"><img src="../../textures/ui/qingxi/bottom_nav_letters_ink_v1.png" alt=""></button><span class="nav-label">信件</span></div>
        <div class="nav-entry"><button class="nav-button" aria-label="百工"><img src="../../textures/ui/qingxi/bottom_nav_craft_ink_v1.png" alt=""></button><span class="nav-label">百工</span></div>
        <div class="nav-entry"><button class="nav-button" aria-label="修行"><img src="../../textures/ui/qingxi/bottom_nav_refinement_ink_v3.png" alt=""></button><span class="nav-label">修行</span></div>
        <div class="nav-entry"><button class="nav-button" aria-label="境界"><img src="../../textures/ui/qingxi/realm_button_ink_v3.png" alt=""></button><span class="nav-label">境界</span></div>
      </nav>
      <div class="spell-entry">
        <button class="spell-button" id="spell-tab" aria-label="术法" aria-expanded="true" aria-controls="spell-panel">
          <img src="../../textures/ui/world/world_spell_entry_ink_v2.png" alt="">
          <span class="enabled-indicator" id="enabled-indicator">行遁中</span>
        </button>
        <span class="spell-label">术法</span>
      </div>
      <aside class="spell-panel open" id="spell-panel" aria-label="已掌握的术法">
        <header class="panel-head">
          <div><h2>已掌握术法</h2><p>当前场景可用 · 1 种</p></div>
          <button class="close" id="close-panel" aria-label="关闭术法列表">×</button>
        </header>
        <div class="spell-grid" aria-label="多列术法图标网格">
          <button class="spell-card" id="spell-card" type="button" aria-label="游骸行遁，点击开启或关闭">
            <img src="../../textures/ui/world/world_spell_youhai_xingdun_v4.png" alt="">
            <span class="spell-name">游骸行遁</span>
            <span class="spell-card-state" id="spell-card-state">行遁中</span>
          </button>
        </div>
        <p class="panel-hint">点击术法项直接使用；持续术法再次点击即可关闭。</p>
      </aside>
      <aside class="spell-tooltip visible" id="spell-tooltip" aria-label="游骸行遁信息栏">
        <div class="tooltip-head">
          <img class="tooltip-icon" src="../../textures/ui/world/world_spell_youhai_xingdun_v4.png" alt="">
          <div><div class="tooltip-title">游骸行遁</div><div class="tooltip-meta">遁行 · 持续施展<br>《乘物游骸真经》· 第一卷「游骸」</div></div>
        </div>
        <div class="tooltip-section">术法详情</div>
        <div class="tooltip-body">行旅期间，有效遁速提高 50%；每跨入一个地图格消耗 1 点大世界精力。仍逐格结算迷雾、地点发现与行旅事件，不改变地形通行或战斗属性。</div>
        <div class="tooltip-route" id="tooltip-route">路线终点未选。选定目的格后，这里显示普通行旅与行遁耗时、预计精力。</div>
      </aside>
      <div class="toast" id="toast"></div>
    </section>
  </main>
  <script>
    const screen = document.querySelector('.screen');
    const map = document.getElementById('map');
    const selection = document.getElementById('map-selection');
    const destinationChip = document.getElementById('destination-chip');
    const panel = document.getElementById('spell-panel');
    const tab = document.getElementById('spell-tab');
    const card = document.getElementById('spell-card');
    const tooltip = document.getElementById('spell-tooltip');
    const toast = document.getElementById('toast');
    const tooltipRoute = document.getElementById('tooltip-route');
    let destinationSelected = false;
    let traveling = false;
    let toastTimer = null;
    let tooltipHideTimer = null;

    function placeTooltip() {
      const screenRect = screen.getBoundingClientRect();
      const panelRect = panel.getBoundingClientRect();
      const tipRect = tooltip.getBoundingClientRect();
      let left = panelRect.left - screenRect.left - tipRect.width - 12;
      if (left < 12) left = Math.min(screenRect.width - tipRect.width - 12, panelRect.right - screenRect.left + 12);
      let top = panelRect.top - screenRect.top + 8;
      if (top + tipRect.height > screenRect.height - 12) top = screenRect.height - tipRect.height - 12;
      tooltip.style.left = `${Math.max(12, left)}px`;
      tooltip.style.top = `${Math.max(12, top)}px`;
    }
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 1900);
    }
    function setPanel(open) {
      panel.classList.toggle('open', open);
      tab.setAttribute('aria-expanded', String(open));
      tooltip.classList.toggle('visible', open && card.matches(':hover, :focus'));
      if (open) requestAnimationFrame(placeTooltip);
    }
    function scheduleTooltipHide() {
      clearTimeout(tooltipHideTimer);
      tooltipHideTimer = setTimeout(() => {
        if (!card.matches(':hover, :focus') && !tooltip.matches(':hover')) tooltip.classList.remove('visible');
      }, 160);
    }
    tab.addEventListener('click', () => setPanel(!panel.classList.contains('open')));
    document.getElementById('close-panel').addEventListener('click', () => setPanel(false));
    card.addEventListener('pointerenter', () => { tooltip.classList.add('visible'); requestAnimationFrame(placeTooltip); });
    card.addEventListener('pointerleave', scheduleTooltipHide);
    card.addEventListener('focus', () => { tooltip.classList.add('visible'); requestAnimationFrame(placeTooltip); });
    card.addEventListener('blur', scheduleTooltipHide);
    tooltip.addEventListener('pointerenter', () => clearTimeout(tooltipHideTimer));
    tooltip.addEventListener('pointerleave', scheduleTooltipHide);
    map.addEventListener('click', event => {
      const screenRect = screen.getBoundingClientRect();
      selection.style.left = `${event.clientX - screenRect.left}px`;
      selection.style.top = `${event.clientY - screenRect.top}px`;
      selection.classList.add('visible');
      destinationChip.classList.add('visible');
      destinationSelected = true;
      tooltipRoute.textContent = '路线终点已选。启用后按当前路径逐格行进；路线耗时和预计精力由实际地图数据计算。';
      showToast('路线终点已选；悬停术法可查看当前路线预估。');
    });
    card.addEventListener('click', () => {
      if (!destinationSelected && !traveling) {
        showToast('请先在地图上选定路线终点。');
        return;
      }
      traveling = !traveling;
      card.classList.toggle('active', traveling);
      document.getElementById('spell-card-state').textContent = traveling ? '行遁中' : '';
      document.getElementById('enabled-indicator').classList.toggle('visible', traveling);
      tooltipRoute.textContent = traveling
        ? '行遁中。再次点击术法项，将在当前格结算后中止。'
        : '路线终点已选。启用后按当前路径逐格行进；路线耗时和预计精力由实际地图数据计算。';
      showToast(traveling ? '游骸行遁已开启。' : '游骸行遁已关闭。');
      setPanel(false);
    });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') setPanel(false); });
    window.addEventListener('resize', () => { if (panel.classList.contains('open')) placeTooltip(); });
    requestAnimationFrame(placeTooltip);
  </script>
</body>
</html>
