<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>云息 · 凝核推演</title>
  <style>
    :root { --paper:#ece4d3; --ink:#29241e; --muted:#766d61; --line:#b9aa93; --panel:#f8f2e7; --gold:#a1702f; --jade:#317267; --red:#a94b40; --blue:#4b7699; --shadow:0 14px 34px #31231620; }
    *{box-sizing:border-box} body{margin:0;background:#d8cfbd;color:var(--ink);font:15px/1.55 "Noto Serif SC","Songti SC",serif}.app{max-width:1400px;margin:auto;padding:24px}.head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:18px}.head h1{font-size:30px;margin:0}.head p{margin:4px 0 0;color:var(--muted)}.round{font-weight:bold;color:var(--gold)}.layout{display:grid;grid-template-columns:230px minmax(0,1fr) 270px;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:16px}.panel h2{font-size:17px;margin:0 0 10px}.metric{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.metric div{background:#eee3d1;padding:8px}.metric b{display:block;font-size:23px}.metric small{color:var(--muted)}.deckline{color:var(--muted);font-size:13px}.cloud{padding:10px;border-left:4px solid var(--blue);background:#e9edf0;margin-bottom:10px}.cloud b{display:block}.rule{font-size:13px;color:var(--muted);margin:8px 0 14px}.hand{display:grid;grid-template-columns:repeat(6,minmax(95px,1fr));gap:8px;min-height:202px}.card{position:relative;min-height:194px;background:#fffaf0;border:1px solid #b5a48a;padding:10px 9px;cursor:grab;transition:.18s}.card:hover{transform:translateY(-3px)}.card.selected{outline:3px solid var(--gold);background:#fff5d9}.card.dragging{opacity:.72;cursor:grabbing}.card.drag-target{outline:3px solid var(--gold);background:#fff5d9;transform:translateY(-3px)}.card.done{opacity:.48;cursor:default}.card.keep{box-shadow:inset 0 -5px 0 var(--jade)}.card .tag{font-size:12px;color:#fff;display:inline-block;padding:1px 5px;background:#777}.card.element-water .tag{background:#4277a3}.card.element-wood .tag{background:#42814e}.card.element-fire .tag{background:#b54e3c}.card.element-earth .tag{background:#8a6b3c}.card.element-metal .tag{background:#777b84}.card .name{font-weight:bold;font-size:17px;margin:7px 0}.card .text{font-size:13px;line-height:1.48}.card .seat{position:absolute;right:8px;top:6px;color:var(--muted);font:12px system-ui}.card .state{position:absolute;bottom:7px;left:8px;font-size:12px;color:var(--jade)}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}.btn{border:1px solid #8c7756;background:#f8f0df;color:var(--ink);padding:8px 12px;cursor:pointer;font:inherit}.btn.primary{background:var(--gold);border-color:var(--gold);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.reserved{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0}.reserved-slot{min-height:66px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px dashed #b9aa93;background:#f1eadc;color:#8d806f;font-size:13px}.choice{margin:8px 0}.choice label{display:block;font-size:13px}.choice select,.choice input{width:100%;padding:6px;font:inherit}.log{max-height:520px;overflow:auto;font-size:13px}.entry{border-bottom:1px solid #d5c9b7;padding:7px 0}.bad{color:var(--red)}.good{color:var(--jade)}.overlay{position:fixed;inset:0;background:#1e1812aa;display:none;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.modal{max-width:760px;width:100%;background:var(--panel);padding:20px;border:1px solid var(--line);box-shadow:var(--shadow)}.candidates{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.candidate{padding:12px;text-align:left;border:1px solid #b9aa93;background:#fffaf0;cursor:pointer;font:inherit}.result{margin-top:12px;padding:10px;background:#eee3d1}.hidden{display:none}@media(max-width:1000px){.layout{grid-template-columns:1fr}.hand{grid-template-columns:repeat(3,1fr)}.log{max-height:260px}}@media(max-width:520px){.app{padding:12px}.hand{grid-template-columns:repeat(2,1fr)}.metric{grid-template-columns:1fr}.head{display:block}}
  </style>
</head>
<body>
<main class="app">
  <header class="head"><div><h1>云息 · 凝核推演</h1><p>八回合 · 六席牌列 · 相邻生克 · 杂质临界即败</p></div><div id="roundLabel" class="round">第 1 回合／共 8 回合</div></header>
  <section class="layout">
    <aside class="panel"><h2>人物与牌库</h2><div class="choice"><label>灵根构成<select id="rootProfile"><option value="tian">天灵根 · 水</option><option value="dual" selected>双灵根 · 水木</option><option value="three">三灵根 · 金木火</option></select></label></div><div class="choice"><label>体魄 <input id="physique" type="number" min="2" max="10" value="5"></label></div><div class="choice"><label>灵慧 <input id="intelligence" type="number" min="2" max="10" value="6"></label></div><div class="choice"><label>敏捷 <input id="agility" type="number" min="2" max="10" value="7"></label></div><div class="choice"><label>神魂 <input id="soul" type="number" min="2" max="10" value="5"></label></div><button id="restart" class="btn">按当前资质重新凝核</button><hr><div id="deckInfo" class="deckline"></div><p class="rule">每回合必须对调两张牌。高资质既影响灵根牌池，也会提高对应四维机制牌的出现率与强度。</p></aside>
    <section class="panel"><div class="metric"><div><small>凝核体积</small><b id="volume">1.00</b></div><div><small>凝核密度</small><b id="density">1.00</b></div><div><small>凝核杂质</small><b id="impurity">0</b></div></div><div id="cloud" class="cloud"></div><div class="rule">本轮结算方向：<b id="direction">左 → 右</b>。<span id="swapHint">拖动一张牌到另一张牌上即可对调并结算。</span>普通牌会在回合结束时自动结算。</div><div id="hand" class="hand" aria-label="本轮六张牌"></div><div id="result" class="result hidden"></div></section>
    <aside class="panel"><h2>外物栏（预留）</h2><div class="reserved" id="materials"><div class="reserved-slot">预留位 1<br>待接入</div><div class="reserved-slot">预留位 2<br>待接入</div><div class="reserved-slot">预留位 3<br>待接入</div><div class="reserved-slot">预留位 4<br>待接入</div></div><p class="rule">天材地宝会在后续材料系统接入后，以独立图标显示并可点击查看效果。当前牌局不读取、不消耗外物。</p><hr><h2>结算日志</h2><div id="log" class="log" aria-live="polite"></div></aside>
  </section>
</main>
<div id="overlay" class="overlay" role="dialog" aria-modal="true"><div class="modal"><h2 id="modalTitle">择牌</h2><p id="modalCopy"></p><div id="candidates" class="candidates"></div></div></div>
<script>
const el=id=>document.getElementById(id),round2=n=>Number(n).toFixed(2);
const produces={metal:'water',water:'wood',wood:'fire',fire:'earth',earth:'metal'},controls={metal:'wood',wood:'earth',earth:'water',water:'fire',fire:'metal'};
const cloudPool=[{name:'凝云',text:'本轮从左至右结算。使用通常的邻位关系。',dir:1},{name:'回风',text:'本轮从右至左结算；右侧紧邻牌视为左侧紧邻牌，生克方向随之倒转。',dir:-1},{name:'连阴',text:'同灵根关系的密度与体积增加值各提高 0.01。',dir:1,same:[.03,.03]},{name:'暖雨',text:'相生关系改为密度 +0.05、杂质 +2。',dir:1,generate:[.05,2]},{name:'冷雨',text:'相生关系改为密度 +0.03、不增加杂质。',dir:1,generate:[.03,0]},{name:'急雨',text:'相克关系改为体积 +0.08、杂质 +3。',dir:1,control:[.08,3]},{name:'细雨',text:'相克关系改为体积 +0.04、不增加杂质。',dir:1,control:[.04,0]},{name:'层云',text:'本轮由牌面明确保留的牌，下回合第一次关系效果翻倍。',dir:1,retainedDouble:true}];
let uid=0,state={},dragIndex=-1;
function card(name,element,text,effect={},special=''){return{id:++uid,name,element,text,effect,special,done:false,keep:false,kept:false,swapped:false};}
function rootCards(element){const base={water:[()=>card('静露','water','本牌结算时，凝核密度 +0.03，杂质 -1；若结算方向后方紧邻牌属水或木，本牌保留至下一回合。',{d:.03,i:-1,keepIf:['water','wood']}),()=>card('汇流','water','本牌结算时，凝核体积 +0.04。',{v:.04}),()=>card('回澜','water','本牌结算时，执行一次标准扩张 0.16。',{expand:.16})],wood:[()=>card('抽芽','wood','本牌结算时，凝核体积 +0.06。',{v:.06}),()=>card('承露','wood','本牌结算时，凝核体积 +0.03；若结算方向后方紧邻牌属木或火，额外 +0.04。',{v:.03,bonusV:.04,neighbor:['wood','fire']}),()=>card('繁枝','wood','本牌结算时，凝核体积 +0.02，并保留至下一回合。',{v:.02,keep:true})],fire:[()=>card('焚浊','fire','本牌结算时，凝核密度 +0.02，杂质 -4。',{d:.02,i:-4}),()=>card('炽息','fire','本牌结算时，凝核密度 +0.05，杂质 -1。',{d:.05,i:-1}),()=>card('淬火','fire','本牌结算时，执行一次标准压缩 0.20，杂质 -2。',{compress:.20,i:-2})],earth:[()=>card('厚载','earth','本牌结算时，凝核体积 +0.08，杂质 +1。',{v:.08,i:1}),()=>card('沉露','earth','本牌结算时，若本牌位于第六位，凝核体积 +0.12；否则 +0.03。',{seatV:[.03,.12]}),()=>card('定壤','earth','本牌结算时，体积低于 1.20 则体积 +0.07；否则密度 +0.03。',{earthBalance:true})],metal:[()=>card('镇列','metal','本牌未参与本轮对调时，本牌触发的关系杂质 -1；本牌参与对调时，关系密度额外 +0.03、杂质额外 +1。',{metalOrder:true}),()=>card('鸣铎','metal','本牌结算时，若结算方向后方紧邻牌属水，金生水的杂质 -1，密度额外 +0.01；否则密度 +0.03。',{metalWater:true,d:.03}),()=>card('敛锋','metal','本牌结算时，执行一次标准压缩 0.16。',{compress:.16})]};return base[element];}
function statCards(s){return{intelligence:[()=>card('观源',null,'本牌结算时，查看抽牌堆顶若干张牌，选择两张依次置入抽牌堆底。',{observe:3+Math.floor(s.intelligence/2)}),()=>card('辨流',null,'本牌结算时，查看抽牌堆顶若干张牌，选择一张置顶、一张置底。',{sort:2+Math.floor(s.intelligence/3)})],agility:[()=>card('先引',null,'本牌优先结算：查看堆顶若干张，选择一张置入第一位，并将最右侧普通牌随机置回牌堆。',{xianyin:1+Math.floor(s.agility/3)},'priority'),()=>card('错步',null,'若本牌参与本轮对调，查看堆顶若干张并选择一张置顶。',{step:1+Math.floor(s.agility/3)})],physique:[()=>card('持势',null,'本牌结算时保留至下一回合；体魄高于等于 8 时，本牌下回合关系效果翻倍。',{keep:true,body:true}),()=>card('承浊',null,'本牌结算时，令本轮下一次关系增加的杂质减少。',{absorb:1+Math.floor(s.physique/4)})],soul:[()=>card('定观',null,'本牌结算时，本轮下一次云候造成的杂质增加改为 0。',{calm:true}),()=>card('叠映',null,'若本轮此前已触发灵根关系，下一次灵根关系结算两次。',{echo:true})]};}
function methodCards(){return[()=>card('依脉',null,'本牌开始结算时，视为结算方向后方最近灵根牌所属灵根。',{depend:true}),()=>card('引脉',null,'本牌不参与邻位关系；可使前后最近灵根牌额外判断一次关系。',{bridge:true}),()=>card('余响',null,'本牌滞后结算：重复本轮最后一次灵根关系。',{echoLast:true},'late'),()=>card('重帘',null,'若本轮已触发同灵根关系，下一次同灵根关系结算两次。',{sameEcho:true})];}
function profileElements(){return el('rootProfile').value==='tian'?['water']:el('rootProfile').value==='dual'?['water','wood']:['metal','wood','fire'];}function stats(){return{physique:+el('physique').value,intelligence:+el('intelligence').value,agility:+el('agility').value,soul:+el('soul').value};}function weighted(entries){let all=[];entries.forEach(x=>{for(let i=0;i<x.weight;i++)all.push(x.make)});return all[Math.floor(Math.random()*all.length)]();}
function buildDeck(){const s=stats(),roots=profileElements(),deck=[];for(let i=0;i<26;i++){const e=roots[Math.floor(Math.random()*roots.length)],a=rootCards(e);deck.push(a[Math.floor(Math.random()*a.length)]());}if(roots.length===1){deck.push(card('归潮','water','本牌结算时，凝核密度 +0.04，体积 +0.04，杂质 -4。',{d:.04,v:.04,i:-4}));deck.push(card('怒潮','water','本牌结算时，执行一次标准扩张 0.50，杂质 +3。',{expand:.50,i:3}));}else if(roots.length===2){roots.forEach(e=>deck.push(card(e==='water'?'归潮':'灵芽',e,'本牌结算时，凝核密度 +0.03，体积 +0.05，杂质 -2。',{d:.03,v:.05,i:-2})));}else{for(let i=0;i<2;i++){const e=roots[Math.floor(Math.random()*roots.length)],a=rootCards(e);deck.push(a[Math.floor(Math.random()*a.length)]());}}const p=statCards(s),keys=['physique','intelligence','agility','soul'];keys.forEach(k=>{const a=p[k];deck.push(a[Math.floor(Math.random()*a.length)]());});for(let i=0;i<8;i++)deck.push(weighted(keys.map(k=>({weight:Math.max(1,Math.floor(s[k]/2)),make:()=>{const a=p[k];return a[Math.floor(Math.random()*a.length)]();}}))));const m=methodCards();for(let i=0;i<8;i++)deck.push(m[Math.floor(Math.random()*m.length)]());return deck.sort(()=>Math.random()-.5);}
function reset(){state={round:1,volume:1,density:1,impurity:0,deck:buildDeck(),discard:[],retained:[],row:[],cloud:null,resolved:new Set(),lastRelation:null,relationCount:0,mod:{},failed:false,log:[]};dragIndex=-1;deal();log('凝核开始：体积、密度均为 1.00，杂质为 0。');render();}function deal(){const keeps=state.retained.splice(0),fresh=[];while(fresh.length+keeps.length<6&&state.deck.length)fresh.unshift(state.deck.shift());state.row=fresh.concat(keeps);state.row.forEach(c=>{c.done=false;c.keep=false;c.swapped=false;});state.cloud=cloudPool[Math.floor(Math.random()*cloudPool.length)];dragIndex=-1;state.resolved=new Set();state.lastRelation=null;state.relationCount=0;state.mod={};}function log(text,kind=''){state.log.unshift({text,kind});}
function addI(n,why=''){if(!n)return;let v=n;state.impurity=Math.max(0,state.impurity+v);if(why)log(`${why}：杂质 ${v>=0?'+':''}${v}。`,v>0?'bad':'good');if(state.impurity>=100){state.impurity=100;state.failed=true;log('杂质达到 100，凝核立刻失败。','bad');}}function addV(n,why=''){if(!n)return;let v=n;state.volume=Math.max(1,state.volume+v);if(why)log(`${why}：体积 ${v>=0?'+':''}${round2(v)}。`,'good');}function addD(n,why=''){if(!n)return;state.density=Math.max(1,state.density+n);if(why)log(`${why}：密度 ${n>=0?'+':''}${round2(n)}。`,'good');}
function compress(c){const total=state.volume*state.density,a=Math.min(c/state.density,state.volume-1);state.volume-=a;state.density=total/state.volume;log(`标准压缩 ${round2(c)}：体积 -${round2(a)}，总量不变。`,'good');}function expand(e){const total=state.volume*state.density,a=Math.min(e*state.density/state.volume,total-state.volume);state.volume+=a;state.density=total/state.volume;log(`标准扩张 ${round2(e)}：体积 +${round2(a)}，总量不变。`,'good');}
function relationFor(a,b){if(!a||!b)return null;if(a===b)return{type:'同灵根',d:state.cloud.same?.[0]??.02,v:state.cloud.same?.[1]??.02,i:0};if(produces[a]===b)return{type:'相生',d:state.cloud.generate?.[0]??.04,v:0,i:state.cloud.generate?.[1]??1};if(controls[a]===b)return{type:'相克',d:0,v:state.cloud.control?.[0]??.06,i:state.cloud.control?.[1]??2};return null;}function elementOf(c,dir){if(!c)return null;if(c.element)return c.element;if(!c.effect.depend)return null;const p=state.row.indexOf(c);for(let i=p+dir;i>=0&&i<state.row.length;i+=dir)if(state.row[i].element)return state.row[i].element;return null;}
function applyRelation(c){const dir=state.cloud.dir,p=state.row.indexOf(c);if(p<0)return;let origin=state.row[p-dir],a=elementOf(origin,dir),b=elementOf(c,dir);if(origin?.effect.bridge){for(let i=p-dir*2;i>=0&&i<state.row.length;i-=dir)if(elementOf(state.row[i],dir)){origin=state.row[i];a=elementOf(origin,dir);break;}}const r=relationFor(a,b);if(!r)return;let{d,v,i}=r;if(origin?.effect.metalOrder&&a==='metal'){if(origin.swapped){d+=.03;i+=1;}else i=Math.max(0,i-1);}if(origin?.effect.metalWater&&a==='metal'&&b==='water'){d+=.01;i=Math.max(0,i-1);}if(state.mod.absorb){i=Math.max(0,i-state.mod.absorb);state.mod.absorb=0;}if(state.mod.calm&&i>0){i=0;state.mod.calm=false;}if(state.mod.echo){d*=2;v*=2;i*=2;state.mod.echo=false;}if(state.mod.sameEcho&&r.type==='同灵根'){d*=2;v*=2;state.mod.sameEcho=false;}if(c.kept&&state.cloud.retainedDouble){d*=2;v*=2;i*=2;c.kept=false;}addD(d,`${r.type}（${a}→${b}）`);addV(v,`${r.type}（${a}→${b}）`);addI(i,`${r.type}（${a}→${b}）`);state.lastRelation={d,v,i,type:r.type};state.relationCount++;}
function choose(cards,title,copy){return new Promise(resolve=>{el('modalTitle').textContent=title;el('modalCopy').textContent=copy;el('candidates').innerHTML='';cards.forEach(c=>{const b=document.createElement('button');b.className='candidate';b.innerHTML=`<b>${c.name}</b><br><small>${c.text}</small>`;b.onclick=()=>{el('overlay').classList.remove('show');resolve(c)};el('candidates').appendChild(b);});el('overlay').classList.add('show');});}
async function resolveCard(c){if(state.failed||state.resolved.has(c.id))return;state.resolved.add(c.id);c.done=true;if(c.special!=='priority'||!c.effect.xianyin)applyRelation(c);if(state.failed)return;const e=c.effect,dir=state.cloud.dir;if(e.xianyin){const n=Math.min(e.xianyin,state.deck.length),opts=state.deck.splice(0,n);if(opts.length){const picked=await choose(opts,'先引','选择一张置入本轮第一位；其余牌回到抽牌堆顶。'),others=opts.filter(x=>x!==picked);state.deck=others.concat(state.deck);const locked=new Set(state.row.filter(x=>x.special==='priority'||x.special==='late').map(x=>x.id));let out=-1;for(let i=state.row.length-1;i>=0;i--)if(!locked.has(state.row[i].id)){out=i;break;}if(out>=0){const old=state.row.splice(out,1)[0];state.deck.splice(Math.floor(Math.random()*(state.deck.length+1)),0,old);picked.insertedAfterQueue=true;state.row.unshift(picked);log(`先引将${old.name}随机置回牌堆，并将${picked.name}置入第一位。`,'good');}else{state.deck.unshift(picked);log('先引未找到可替换的普通牌。','bad');}}}else if(e.observe){const opts=state.deck.splice(0,Math.min(e.observe,state.deck.length));if(opts.length){const first=await choose(opts,'观源','选择第一张置入牌堆底。'),rest=opts.filter(x=>x!==first),second=rest.length?await choose(rest,'观源','选择第二张置入牌堆底。'):null;state.deck=rest.filter(x=>x!==second).sort(()=>Math.random()-.5).concat(state.deck);state.deck.push(first);if(second)state.deck.push(second);log('观源整理了未来牌序。','good');}}else if(e.sort){const opts=state.deck.splice(0,Math.min(e.sort,state.deck.length));if(opts.length){const top=await choose(opts,'辨流','选择一张置回牌堆顶。'),rest=opts.filter(x=>x!==top),bottom=rest.length?await choose(rest,'辨流','选择一张置入牌堆底。'):null;state.deck=[top].concat(rest.filter(x=>x!==bottom).sort(()=>Math.random()-.5),state.deck);if(bottom)state.deck.push(bottom);log('辨流定下了一张顶牌与一张底牌。','good');}}else if(e.step&&c.swapped){const opts=state.deck.splice(0,Math.min(e.step,state.deck.length));if(opts.length){const top=await choose(opts,'错步','选择一张置回牌堆顶。');state.deck=[top].concat(opts.filter(x=>x!==top).sort(()=>Math.random()-.5),state.deck);log('错步借由本轮对调，校正了牌堆顶。','good');}}else if(e.d)addD(e.d,c.name);if(e.v)addV(e.v,c.name);if(e.i){const n=e.i;addI(n,c.name);if(state.failed){render();return;}}if(e.compress)compress(e.compress);if(e.expand)expand(e.expand);if(e.seatV)addV(state.row.indexOf(c)===5?e.seatV[1]:e.seatV[0],c.name);if(e.earthBalance){if(state.volume<1.2)addV(.07,c.name);else addD(.03,c.name);}if(e.bonusV&&e.neighbor?.includes(elementOf(state.row[state.row.indexOf(c)+dir],dir)))addV(e.bonusV,c.name);if(state.failed){render();return;}if(e.absorb)state.mod.absorb=e.absorb;if(e.calm)state.mod.calm=true;if(e.echo&&state.relationCount>0)state.mod.echo=true;if(e.sameEcho)state.mod.sameEcho=true;if(e.echoLast&&state.lastRelation){addD(state.lastRelation.d,'余响');addV(state.lastRelation.v,'余响');addI(state.lastRelation.i,'余响');if(state.failed){render();return;}}if(e.keep||e.keepIf?.includes(elementOf(state.row[state.row.indexOf(c)+dir],dir))){c.keep=true;}render();}
async function swapAndSettle(a,b){if(a<0||b<0||a===b||a>=state.row.length||b>=state.row.length||state.failed||!el('result').classList.contains('hidden'))return;[state.row[a],state.row[b]]=[state.row[b],state.row[a]];state.row[a].swapped=state.row[b].swapped=true;log(`强制对调：${state.row[a].name} 与 ${state.row[b].name}互换位置。`);render();const initial=state.row.map(x=>x.id),priorities=state.row.filter(x=>x.special==='priority').sort((x,y)=>initial.indexOf(x.id)-initial.indexOf(y.id)),late=state.row.filter(x=>x.special==='late').sort((x,y)=>initial.indexOf(x.id)-initial.indexOf(y.id));for(const c of priorities){await resolveCard(c);if(state.failed)break;}if(!state.failed){const normal=()=>state.row.filter(x=>!state.resolved.has(x.id)&&(x.special!=='late'||x.insertedAfterQueue)).sort((x,y)=>state.cloud.dir*(state.row.indexOf(x)-state.row.indexOf(y)));for(const c of normal()){await resolveCard(c);if(state.failed)break;}}if(!state.failed)for(const c of late){await resolveCard(c);if(state.failed)break;}if(state.failed){finish(false);return;}const carry=[];for(const c of state.row){if(c.keep){c.kept=true;c.keep=false;carry.push(c);}else state.discard.push(c);}state.retained=carry;if(state.round>=8){finish(true);return;}state.round++;deal();log(`第 ${state.round} 回合：补牌完成，等待强制对调。`);render();}
function finish(ok){const q=state.impurity<10?'澄澈':state.impurity<35?'清正':state.impurity<65?'驳杂':'危核';el('result').classList.remove('hidden');el('result').innerHTML=ok?`<b class="good">灵核已成 · ${q}</b><br>体积 ${round2(state.volume)}　密度 ${round2(state.density)}　杂质 ${round2(state.impurity)}<br>总量 ${round2(state.volume*state.density)}`:`<b class="bad">凝核失败</b><br>杂质在第 ${state.round} 回合达到 100，牌局已中止。`;render();}
function render(){el('roundLabel').textContent=`第 ${state.round} 回合／共 8 回合`;el('volume').textContent=round2(state.volume);el('density').textContent=round2(state.density);el('impurity').textContent=round2(state.impurity);el('cloud').innerHTML=`<b>云候 · ${state.cloud.name}</b>${state.cloud.text}`;el('direction').textContent=state.cloud.dir===1?'左 → 右':'右 → 左';el('deckInfo').textContent=`抽牌堆 ${state.deck.length} 张　弃牌堆 ${state.discard.length} 张　保留 ${state.retained.length} 张`;el('hand').innerHTML='';state.row.forEach((c,i)=>{const b=document.createElement('button');b.className=`card element-${c.element||'none'} ${c.swapped?'selected':''} ${c.done?'done':''} ${c.kept?'keep':''}`;b.disabled=c.done||state.failed||!el('result').classList.contains('hidden');b.draggable=!b.disabled;b.innerHTML=`<span class="seat">第 ${i+1} 位</span><span class="tag">${c.special==='priority'?'优先':c.special==='late'?'滞后':c.element?{water:'水',wood:'木',fire:'火',earth:'土',metal:'金'}[c.element]:'机制'}</span><div class="name">${c.name}</div><div class="text">${c.text}</div><span class="state">${c.swapped?'本轮已调位':c.kept?'上轮保留':''}</span>`;b.addEventListener('dragstart',event=>{dragIndex=i;b.classList.add('dragging');if(event.dataTransfer){event.dataTransfer.effectAllowed='move';event.dataTransfer.setData('text/plain',String(i));}el('swapHint').textContent='松开到另一张牌上即可对调并结算。';});b.addEventListener('dragover',event=>{if(dragIndex>=0&&dragIndex!==i&&!b.disabled){event.preventDefault();b.classList.add('drag-target');}});b.addEventListener('dragleave',()=>b.classList.remove('drag-target'));b.addEventListener('drop',event=>{event.preventDefault();b.classList.remove('drag-target');const from=dragIndex;dragIndex=-1;if(from>=0&&from!==i)swapAndSettle(from,i);});b.addEventListener('dragend',()=>{dragIndex=-1;b.classList.remove('dragging');});el('hand').appendChild(b);});el('swapHint').textContent=state.failed?'凝核已停止。':el('result').classList.contains('hidden')?'拖动一张牌到另一张牌上即可对调并结算。':'牌局已结束。';el('log').innerHTML=state.log.map(x=>`<div class="entry ${x.kind}">${x.text}</div>`).join('');}el('restart').onclick=reset;reset();
</script>
